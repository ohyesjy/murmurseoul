<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun · select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent !important; }
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
  body { display:flex; flex-direction:column; font-family:"Special Elite","Zen Kaku Gothic New",serif; }

  .panel {
    position: relative;
    flex: 1;
    min-height: 50vh;
    cursor: pointer;
    overflow: hidden;
    background: #0a0a0a;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 300ms ease;
  }
  .panel::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(circle at 45% 80%, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 4px 4px, 5px 5px;
    pointer-events: none;
    opacity: 0.8;
  }
  .panel:hover { transform: scale(1.01); }
  .panel:hover .panel-label { opacity: 1; }

  .panel-divider {
    height: 2px;
    background: #1a1a1a;
    flex-shrink: 0;
  }

  .panel svg {
    width: min(60%, 420px);
    height: auto;
    max-height: 80%;
    display: block;
    position: relative;
    z-index: 2;
  }

  .panel-label {
    position: absolute;
    color: #fff;
    font-family: "Special Elite", "Zen Kaku Gothic New", serif;
    letter-spacing: 0.15em;
    z-index: 3;
    opacity: 0.85;
    transition: opacity 300ms ease;
    text-align: left;
    pointer-events: none;
  }
  /* 상단: 손가락 그림 위쪽 빈 공간 */
  .panel-top .panel-label {
    top: 12%;
    left: 8%;
    font-size: clamp(14px, 2.2vw, 22px);
    line-height: 1.5;
  }
  .panel-top .panel-label .en { display:block; }
  .panel-top .panel-label .jp { display:block; margin-top:4px; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:300; font-size:0.85em; opacity:0.85; }

  /* 하단: 보트 그림 오른쪽 위 */
  .panel-bottom .panel-label {
    top: 8%;
    right: 7%;
    text-align: right;
    font-size: clamp(11px, 1.6vw, 15px);
    line-height: 1.8;
    letter-spacing: 0.1em;
  }
  .panel-bottom .panel-label .item { display:block; }

  /* 클릭 인디케이터 (하단 오른쪽 아래) */
  .panel-bottom::before {
    content: "→";
    position: absolute;
    right: 20px; bottom: 14px;
    color: #fff;
    font-size: 20px;
    opacity: 0.5;
    z-index: 3;
  }
  .panel-top::before {
    content: "→";
    position: absolute;
    right: 20px; bottom: 14px;
    color: #fff;
    font-size: 20px;
    opacity: 0.5;
    z-index: 3;
  }
</style>
</head>
<body>

  <!-- 상단: 손가락 + 눈꽃, 클릭시 분당(바지락) 페이지 -->
  <a class="panel panel-top" href="main.html" aria-label="분당 페이지로">
    <div class="panel-label">
      <span class="en">bun dang</span>
      <span class="jp">気になる</span>
    </div>
    <svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 손 (손가락 위로, 간략화) -->
      <g fill="#f0f0f0" stroke="#d0d0d0" stroke-width="1.5">
        <!-- 손바닥 뒤쪽 -->
        <path d="M 60 230
                 Q 60 210, 90 200
                 L 200 185
                 L 230 100
                 Q 234 70, 258 68
                 Q 280 70, 278 100
                 L 260 180
                 L 400 200
                 Q 440 210, 440 240
                 L 440 280
                 L 60 280 Z"/>
        <!-- 약간의 손가락 디테일 -->
        <path d="M 250 180 L 268 180" stroke="#b0b0b0" stroke-width="1" fill="none"/>
      </g>
      <!-- 손가락 끝의 눈꽃 -->
      <g transform="translate(268, 52)">
        <g fill="#ffffff" opacity="0.95">
          <circle cx="0" cy="0" r="2.5"/>
          <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
            <line x1="0" y1="-14" x2="0" y2="14"/>
            <line x1="-14" y1="0" x2="14" y2="0"/>
            <line x1="-10" y1="-10" x2="10" y2="10"/>
            <line x1="-10" y1="10" x2="10" y2="-10"/>
            <path d="M -4 -14 L 0 -10 L 4 -14" fill="none"/>
            <path d="M -4 14 L 0 10 L 4 14" fill="none"/>
            <path d="M -14 -4 L -10 0 L -14 4" fill="none"/>
            <path d="M 14 -4 L 10 0 L 14 4" fill="none"/>
          </g>
        </g>
      </g>
    </svg>
  </a>

  <div class="panel-divider"></div>

  <!-- 하단: 보트 + 사람, 클릭시 큐레이터 페이지 -->
  <a class="panel panel-bottom" href="curator.html" aria-label="큐레이터 페이지로">
    <div class="panel-label">
      <span class="item">Recommended YouTube</span>
      <span class="item">Webtoons + Web Novels</span>
    </div>
    <svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 작은 눈꽃들 (주변) -->
      <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
        <g transform="translate(80, 200)">
          <line x1="-8" y1="0" x2="8" y2="0"/>
          <line x1="0" y1="-8" x2="0" y2="8"/>
          <line x1="-6" y1="-6" x2="6" y2="6"/>
          <line x1="-6" y1="6" x2="6" y2="-6"/>
        </g>
        <g transform="translate(110, 70)">
          <line x1="-6" y1="0" x2="6" y2="0"/>
          <line x1="0" y1="-6" x2="0" y2="6"/>
          <line x1="-4" y1="-4" x2="4" y2="4"/>
          <line x1="-4" y1="4" x2="4" y2="-4"/>
        </g>
        <g transform="translate(410, 60)">
          <line x1="-10" y1="0" x2="10" y2="0"/>
          <line x1="0" y1="-10" x2="0" y2="10"/>
          <line x1="-7" y1="-7" x2="7" y2="7"/>
          <line x1="-7" y1="7" x2="7" y2="-7"/>
        </g>
      </g>

      <!-- 노 (왼쪽) -->
      <g stroke="#f0f0f0" stroke-width="3" fill="#f0f0f0" stroke-linecap="round">
        <line x1="200" y1="160" x2="120" y2="210"/>
        <ellipse cx="115" cy="213" rx="15" ry="6" transform="rotate(-30 115 213)"/>
      </g>
      <!-- 노 (오른쪽) -->
      <g stroke="#f0f0f0" stroke-width="3" fill="#f0f0f0" stroke-linecap="round">
        <line x1="300" y1="160" x2="380" y2="210"/>
        <ellipse cx="385" cy="213" rx="15" ry="6" transform="rotate(30 385 213)"/>
      </g>

      <!-- 보트 -->
      <g fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linejoin="round">
        <!-- 보트 위에서 본 모양 -->
        <path d="M 190 100
                 Q 250 80, 310 100
                 L 330 210
                 Q 250 230, 170 210 Z"/>
        <!-- 가로 살 -->
        <line x1="205" y1="130" x2="295" y2="130"/>
        <line x1="200" y1="165" x2="300" y2="165"/>
        <line x1="195" y1="195" x2="305" y2="195"/>
      </g>

      <!-- 사람 (작은 막대 인물) -->
      <g fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1">
        <!-- 머리 -->
        <circle cx="250" cy="130" r="10" stroke-width="1.5" fill="#f0f0f0"/>
        <!-- 눈 -->
        <circle cx="247" cy="130" r="1" fill="#0a0a0a"/>
        <circle cx="253" cy="130" r="1" fill="#0a0a0a"/>
        <!-- 몸 -->
        <path d="M 240 142 Q 250 140, 260 142 L 262 170 L 238 170 Z" stroke-width="1.5"/>
        <!-- 팔 (노 잡고 있는 모양) -->
        <line x1="240" y1="150" x2="210" y2="160" stroke-width="1.8"/>
        <line x1="260" y1="150" x2="290" y2="160" stroke-width="1.8"/>
      </g>
    </svg>
  </a>

</body>
</html>
