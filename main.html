<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun · 분당 / bundang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=New+Tegomin&family=Shippori+Mincho:wght@500;600&family=Special+Elite&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background: #f3eee2;
    color: #1a1a1a;
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    padding: 30px 14px 60px;
  }

  /* ─── 영수증 프레임 ─── */
  .receipt-frame {
    position: relative;
    width: 700px;
    max-width: 96vw;
    aspect-ratio: 687 / 895;
    margin: 0 auto;
    background-image: url('bundang-receipt.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center top;
  }

  /* ─── 1) 헤더 (위 점선 위쪽) ─── */
  .zone-header {
    position: absolute;
    top: 1.4%;
    left: 7%;
    right: 7%;
    height: 5.5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Special Elite", "Zen Kaku Gothic New", monospace;
    color: #000;
    font-weight: 700;
    letter-spacing: 0.15em;
    font-size: clamp(11px, 1.6vw, 14px);
  }
  .zone-header .map-link {
    color: #000;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 0.85em;
    letter-spacing: 0.08em;
    margin-left: 8px;
  }

  /* ─── 2) 메인 (위 점선 ~ 첫 아래 점선) ─── */
  .zone-main {
    position: absolute;
    top: 8.5%;
    left: 7%;
    right: 7%;
    height: 60%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding-top: 2%;
    overflow: hidden;
  }

  /* 바지락 영상 — 중앙, 9:16 portrait */
  .video-col {
    width: clamp(150px, 34%, 200px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .shop-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .video-wrap {
    width: 100%;
    aspect-ratio: 480 / 854;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background: #f0eadc;
    border-radius: 2px;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .restaurant-name {
    font-family: "New Tegomin", "Hachi Maru Pop", serif;
    font-size: clamp(13px, 1.8vw, 16px);
    text-align: center;
    margin-top: 6px;
    letter-spacing: 0.04em;
    color: #1a1a1a;
    line-height: 1.3;
  }
  .restaurant-name .ja {
    display: block;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 0.7em;
    letter-spacing: 0.08em;
    margin-top: 3px;
    color: #444;
    font-weight: 400;
  }

  /* 메뉴 — 영상 아래 */
  .menu-col {
    width: 88%;
    max-width: 460px;
    margin-top: 6px;
    color: #1a1a1a;
  }
  .menu-col .menu-head {
    font-family: "Special Elite", monospace;
    font-size: clamp(9px, 1.1vw, 11px);
    letter-spacing: 0.32em;
    color: #c8243a;
    margin-bottom: 6px;
    text-align: center;
  }
  .menu-col ul {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
    font-family: "Shippori Mincho", "Zen Kaku Gothic New", serif;
    font-size: clamp(10.5px, 1.3vw, 12.5px);
    line-height: 1.7;
  }
  .menu-col li {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dotted rgba(0,0,0,0.15);
    padding: 1px 4px;
  }
  .menu-col li .nm { letter-spacing: 0.02em; }
  .menu-col li .pr { font-family: "Special Elite", monospace; font-size: 0.92em; opacity: 0.8; }
  .menu-col .hours {
    font-family: "Shippori Mincho", serif;
    font-size: clamp(10.5px, 1.2vw, 12px);
    margin-top: 5px;
    padding: 4px 10px;
    border-top: 1px dashed rgba(0,0,0,0.3);
    border-bottom: 1px dashed rgba(0,0,0,0.3);
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* ─── 3) 리뷰 (점선 사이 — y 75~84%) ─── */
  .zone-reviews {
    position: absolute;
    top: 75.5%;
    left: 7%;
    right: 7%;
    height: 8.5%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4%;
    overflow: hidden;
  }
  .review-rotate {
    width: 100%;
    text-align: center;
    font-family: "Shippori Mincho", "Zen Kaku Gothic New", serif;
    color: #1a1a1a;
    transition: opacity 0.5s ease;
  }
  .review-rotate .rt {
    display: block;
    font-size: clamp(14px, 2.1vw, 18px);
    line-height: 1.7;
    margin-bottom: 6px;
    min-height: 2.4em;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .review-rotate .ra {
    display: block;
    font-family: "Special Elite", monospace;
    font-size: clamp(11px, 1.3vw, 13px);
    color: #888;
    letter-spacing: 0.15em;
  }
  .review-rotate .caret {
    display: inline-block;
    width: 0.45em;
    background: currentColor;
    animation: caretBlink 0.9s steps(2) infinite;
    margin-left: 1px;
    vertical-align: -2px;
    opacity: 0.7;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* ─── 4) 하단 ASCII 아트 (바코드 자리 — y 88~96%) ─── */
  .zone-ascii {
    position: absolute;
    top: 88%;
    left: 7%;
    right: 7%;
    height: 9%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 1%;
  }
  .zone-ascii img {
    height: 100%;
    width: auto;
    max-width: 80%;
    object-fit: contain;
    opacity: 0.85;
    mix-blend-mode: multiply;
  }

  /* ─── 홈/뒤로 — 텍스트 동일 스타일 ─── */
  .back-link, .home-link {
    position: fixed;
    right: 18px;
    font-family: "Special Elite", monospace;
    font-size: 12px;
    color: #1a1a1a;
    text-decoration: none;
    letter-spacing: 0.1em;
    opacity: 0.55;
    padding: 6px 10px;
    z-index: 50;
    background: rgba(255,255,255,0.85);
    border-radius: 4px;
    transition: opacity 200ms ease;
  }
  .back-link { bottom: 42%; }
  .home-link { bottom: calc(42% + 36px); }
  .back-link:hover, .home-link:hover { opacity: 1; }

  /* ─── 모바일 ─── */
  @media (max-width: 600px) {
    body { padding: 16px 8px 40px; }
    .receipt-frame { width: 100%; max-width: none; }
    .zone-header { font-size: 10px; }
    .menu-col .menu-head { font-size: 9px; }
    .menu-col ul { font-size: 10.5px; line-height: 1.7; }
    .menu-col .hours { font-size: 10px; padding: 4px 6px; }
    .restaurant-name { font-size: 12px; }
    .review-rotate .rt { font-size: 13px; line-height: 1.55; }
    .review-rotate .ra { font-size: 10.5px; }
    .back-link, .home-link { right: 8px; font-size: 11px; padding: 5px 8px; }
    .home-link { bottom: calc(42% + 32px); }
  }
</style>
</head>
<body>
  <a class="home-link" href="index.html">⌂ home</a>
  <a class="back-link" href="index.html">← back</a>

  <div class="receipt-frame">
    <!-- 1. 헤더 — 위 점선 위쪽 -->
    <div class="zone-header">
      <span>분당 / bundang</span>
      <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=37.3926442%2C127.011839&query_place_id=%EC%A0%84%EB%9D%BC%EB%8F%84%ED%8C%A5%EB%B0%94%EC%A7%80%EB%9D%BD%EC%B9%BC%EA%B5%AD%EC%88%98" target="_blank" rel="noopener noreferrer">[google map]</a>
    </div>

    <!-- 2. 메인 — 바지락 영상 (중앙) + 매장이름 + 메뉴 -->
    <div class="zone-main">
      <!-- 영상 (중앙, 9:16 portrait) -->
      <div class="video-col">
        <a class="shop-link" href="https://naver.me/xnhy8pL6" target="_blank" rel="noopener noreferrer">
          <div class="video-wrap">
            <video src="bajirak.mp4" autoplay muted loop playsinline preload="auto" webkit-playsinline></video>
          </div>
          <div class="restaurant-name">
            전라도팥바지락칼국수
            <span class="ja">[ チョルラドパッ バジラクカルグクス ]</span>
          </div>
        </a>
      </div>

      <!-- 일본어 메뉴 + 운영시간 -->
      <div class="menu-col">
        <div class="menu-head">★ MENU</div>
        <ul>
          <li><span class="nm">バジラクカルグクス</span><span class="pr">₩12,000</span></li>
          <li><span class="nm">パッカルグクス</span><span class="pr">₩12,000</span></li>
          <li><span class="nm">バジラクタン</span><span class="pr">₩18,000</span></li>
          <li><span class="nm">バジラクチヂミ</span><span class="pr">₩18,000</span></li>
        </ul>
        <div class="hours">毎日 10:00 — 21:00</div>
      </div>
    </div>

    <!-- 3. 리뷰 — 점선 사이, 1개씩 회전 + 타이핑 -->
    <div class="zone-reviews">
      <div class="review-rotate" id="reviewRotate">&nbsp;</div>
    </div>

    <!-- 4. 하단 — 바코드 자리에 주먹밥+오차 ASCII -->
    <div class="zone-ascii">
      <img src="onigiri-tea.png" alt="onigiri & tea" />
    </div>
  </div>

  <script>
    // 리뷰 데이터
    const REVIEWS = [
      { t: '"あさりたっぷり。スープが澄んで旨みが濃い。絶品の一杯。"', a: '@kana_tokyo' },
      { t: '"雨の日に思い出す味。あさりの出汁が冷えた体を温めてくれる。"', a: '@reader_yumi' },
      { t: '"70歳になってもここに来るよ。ウィワン分당の名店。"', a: '@seoul_local' }
    ];

    const rotateEl = document.getElementById('reviewRotate');
    let curIdx = 0;
    let typingTimer = null;

    function escAttr(s) { return (s||'').replace(/"/g, '&quot;'); }

    function typeText(span, text, cb) {
      let i = 0;
      function step() {
        if (i <= text.length) {
          span.innerHTML = text.slice(0, i).replace(/</g,'&lt;') + '<span class="caret">&nbsp;</span>';
          i++;
          const ch = text[i-2] || '';
          const delay = (ch === '。' || ch === '"' || ch === '、') ? 80 : 32;
          typingTimer = setTimeout(step, delay);
        } else if (cb) cb();
      }
      step();
    }

    function renderOne(r, onComplete) {
      rotateEl.style.opacity = 0;
      setTimeout(() => {
        rotateEl.innerHTML = `<span class="rt"></span><span class="ra">— ${r.a}</span>`;
        rotateEl.style.opacity = 1;
        const rt = rotateEl.querySelector('.rt');
        typeText(rt, r.t, () => {
          // caret 제거
          const c = rt.querySelector('.caret');
          if (c) c.remove();
          // 4초 후 다음 리뷰
          setTimeout(onComplete, 4200);
        });
      }, 600);
    }

    function loop() {
      renderOne(REVIEWS[curIdx], () => {
        curIdx = (curIdx + 1) % REVIEWS.length;
        loop();
      });
    }
    loop();
  </script>
</body>
</html>
