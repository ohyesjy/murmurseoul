<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>murmur josun · 그림일기 LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Hachi+Maru+Pop&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #f0ede4; color: #1a1a1a; font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif; -webkit-user-select: none; user-select: none; }
  .top-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(240,237,228,0.95); backdrop-filter: blur(8px);
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #d8d4c4;
  }
  .top-bar .title { font-family: "Special Elite", monospace; font-size: 12px; letter-spacing: 0.16em; }
  .top-bar .live { color: #c8243a; }
  .top-bar .live::before { content: "● "; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .top-bar .right-side { display: flex; gap: 8px; align-items: center; }
  .top-bar .badge { font-family: "Special Elite", monospace; font-size: 9px; padding: 3px 8px; background: #fff; border: 1px solid #ccc; border-radius: 999px; color: #555; letter-spacing: 0.1em; }
  .top-bar a.back { font-family: "Special Elite", monospace; font-size: 11px; color: #1a1a1a; text-decoration: none; padding: 5px 9px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .role-toggle { font-family: "Special Elite", monospace; font-size: 9px; padding: 3px 8px; border: 1px solid #1a1a1a; background: #fff; border-radius: 999px; cursor: pointer; letter-spacing: 0.1em; }
  .role-toggle.host { background: #1a1a1a; color: #fff; }

  /* 그림일기 본체 */
  .diary {
    max-width: 720px; margin: 12px auto; padding: 0;
    background: #fff;
    border: 1px solid #c8c4b4;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  /* 헤더 — 년/월/일/요일/날씨 */
  .diary-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1.4fr;
    border-bottom: 1px solid #1a1a1a;
  }
  .diary-header > div {
    padding: 10px 6px;
    text-align: center;
    font-family: "Hachi Maru Pop", "Zen Kaku Gothic New", sans-serif;
    font-size: 13px;
    border-right: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }
  .diary-header > div:last-child { border-right: 0; }
  .diary-header .label { font-size: 11px; color: #888; }
  .diary-header .value { font-weight: 500; }
  .weather-grid { display: flex; gap: 8px; justify-content: center; align-items: center; }
  .weather-grid .w {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.4;
    border-radius: 50%; font-size: 16px;
    transition: 0.2s;
  }
  .weather-grid .w.active { opacity: 1; background: #fff8b0; }
  .weather-grid .w:hover { opacity: 0.85; }

  /* 메인 캔버스 영역 */
  .canvas-area {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #fff;
    border-bottom: 1px solid #1a1a1a;
  }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; position: absolute; inset: 0; z-index: 10; pointer-events: none !important; }
  .canvas-area #items-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .canvas-area .item { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }
  .canvas-area .item.photo {
    width: 30%;
    max-width: 240px;
  }
  .canvas-area .item.photo img {
    width: 100%;
    height: auto;
    max-width: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    display: block;
  }
  .canvas-locked-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.01);
    display: flex; align-items: flex-end; justify-content: center; padding: 10px;
    z-index: 5;
  }
  .canvas-locked-overlay span {
    font-family: "Special Elite", monospace; font-size: 10px; color: #999;
    background: rgba(255,255,255,0.85); padding: 4px 10px; border-radius: 999px;
    border: 1px solid #ddd; letter-spacing: 0.1em;
  }

  /* 제목 바 */
  .title-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #1a1a1a;
    font-family: "Hachi Maru Pop", "Zen Kaku Gothic New", sans-serif;
    font-size: 14px;
  }
  .title-bar .label { color: #555; flex-shrink: 0; }
  .title-bar input {
    flex: 1;
    border: 0; outline: 0; background: transparent;
    font-family: inherit; font-size: 15px;
    -webkit-user-select: text; user-select: text;
    padding: 2px 0;
  }
  .title-bar input:disabled { color: #1a1a1a; }

  /* 댓글 영역 (격자) */
  .comments-area {
    min-height: 280px;
    background-image:
      linear-gradient(to right, #d4d0c0 1px, transparent 1px),
      linear-gradient(to bottom, #d4d0c0 1px, transparent 1px);
    background-size: 36px 36px;
    background-color: #fdfcf6;
    padding: 16px 14px 18px;
  }
  .comments-head {
    font-family: "Hachi Maru Pop", "Zen Kaku Gothic New", sans-serif;
    font-size: 12px; color: #888;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  .comments-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 30vh;
    min-height: 180px;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    padding-right: 2px;
  }
  /* 호스트 캔버스 타이핑 바 — 제목 바로 위 */
  .host-canvas-input {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 12px;
    background: #fafaf6;
    border-bottom: 1px solid #1a1a1a;
  }
  /* 댓글 사라짐 애니메이션 */
  .comment.leaving {
    pointer-events: none;
    animation: cmtLeave 0.32s ease-in forwards;
  }
  @keyframes cmtLeave {
    to {
      opacity: 0;
      transform: translateY(-12px);
      max-height: 0;
      margin-top: -10px;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
      border-width: 0;
    }
  }
  .comment {
    animation: slideUpIn 0.32s ease-out;
  }
  @keyframes slideUpIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .comment {
    background: #fff; border: 1px solid #e6e2d2;
    border-radius: 12px; padding: 9px 12px;
    font-size: 13px; line-height: 1.55;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    word-break: break-word;
    max-width: 78%;
    position: relative;
  }
  /* 단톡방 스타일 — 내 댓글 우측 노랑, 남 댓글 좌측 흰 */
  .comment.own {
    align-self: flex-end;
    background: #fee500;
    border-color: rgba(0,0,0,0.06);
    border-bottom-right-radius: 4px;
  }
  .comment.own .meta { justify-content: flex-end; }
  .comment.other {
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .comment .meta {
    font-family: "Special Elite", monospace;
    font-size: 9px; color: #888; letter-spacing: 0.08em;
    margin-bottom: 4px;
    display: flex; gap: 6px; align-items: center;
  }
  .comment .meta .name { color: #c8243a; }
  .comment.photo img {
    max-width: 100%; max-height: 240px;
    border-radius: 3px; display: block; margin-top: 4px;
  }
  .comment.drawing canvas {
    width: 100%; max-width: 280px; height: auto;
    background: #fff; border: 1px solid #eee; border-radius: 3px;
  }

  /* 도구 바 (하단 고정) */
  .toolbar {
    position: sticky; bottom: 0; z-index: 60;
    background: #fff;
    border-top: 1px solid #ccc;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .toolbar .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .colors { display: flex; gap: 6px; flex: 1; }
  .color { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer; }
  .color.active { box-shadow: 0 0 0 2px #1a1a1a; }
  .sizes { display: flex; gap: 4px; }
  .size { width: 28px; height: 24px; border: 1px solid #ddd; background: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .size.active { background: #1a1a1a; }
  .size .dot { background: #1a1a1a; border-radius: 50%; }
  .size.active .dot { background: #fff; }
  .size .s1 { width: 4px; height: 4px; }
  .size .s2 { width: 7px; height: 7px; }
  .size .s3 { width: 11px; height: 11px; }
  .btn {
    font-family: "Special Elite", monospace;
    font-size: 10px; letter-spacing: 0.1em;
    padding: 6px 10px; border: 1px solid #ddd; background: #fff;
    border-radius: 4px; cursor: pointer;
  }
  .btn:active { background: #f0f0f0; }
  .btn.primary { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
  .btn.danger { color: #c8243a; border-color: #c8243a; }

  .tools-host { display: none; }
  .tools-host.show { display: block; }
  .tools-visitor { display: block; }  /* 댓글 입력은 host도 visitor도 항상 표시 */
  .tools-visitor.show { display: block; }
  .comment-input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; -webkit-user-select: text; user-select: text; font-family: inherit; }

  /* 닉네임 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal-bg.hidden { display: none; }
  .modal { background: #fff; border-radius: 8px; padding: 26px 22px; max-width: 360px; width: 100%; text-align: center; }
  .modal h2 { font-family: "Special Elite", monospace; font-size: 14px; letter-spacing: 0.16em; margin: 0 0 8px; }
  .modal p { font-size: 12px; color: #666; margin: 0 0 14px; line-height: 1.6; }
  .modal input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; margin-bottom: 8px; -webkit-user-select: text; user-select: text; font-family: inherit; touch-action: manipulation; }
  .modal .btn { min-height: 48px; touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,0.1) !important; }
  .role-choice { display: flex; gap: 8px; margin: 12px 0; }
  .role-choice .btn { flex: 1; padding: 12px; font-size: 11px; }
  .role-choice .btn.selected { background: #c8243a; color: #fff; border-color: #c8243a; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.85); color: #fff; padding: 8px 16px; border-radius: 999px; font-family: "Special Elite", monospace; font-size: 11px; letter-spacing: 0.1em; z-index: 300; opacity: 0; pointer-events: none; transition: 0.3s; }
  .toast.show { opacity: 1; }
  .photo-input { display: none; }

  @media (max-width: 540px) {
    .diary { margin: 4px; }
    .diary-header > div { font-size: 11px; padding: 8px 4px; gap: 3px; }
    .weather-grid .w { width: 18px; height: 18px; font-size: 13px; }
    .title-bar { padding: 8px 12px; font-size: 12px; }
    .title-bar input { font-size: 13px; }
    .comments-area { background-size: 28px 28px; padding: 12px 10px; }
    .comments-list { gap: 8px; }
    .btn { font-size: 9px; padding: 5px 8px; }
    /* 모바일 — 댓글 전송/사진 버튼 15% 키움 */
    #btnComSend, #btnComPhoto { font-size: 11px; padding: 8px 14px; min-height: 38px; }
    .top-bar .badge { font-size: 8px; padding: 2px 6px; }
    .back-link { right: 10px; bottom: 42%; font-size: 11px; padding: 5px 8px; }
    .home-link { right: 10px; bottom: calc(42% + 32px); font-size: 11px; padding: 5px 8px; }
  }
  .back-link { position: fixed; bottom: 42%; right: 18px; font-family: "Special Elite", monospace; font-size: 12px; color: #1a1a1a; text-decoration: none; letter-spacing: 0.1em; opacity: 0.6; padding: 6px 10px; z-index: 50; background: rgba(255,255,255,0.9); border: 1px solid #ccc; border-radius: 4px; transition: opacity 200ms ease; }
  .back-link:hover { opacity: 1; }
  .home-link { position: fixed; bottom: calc(42% + 36px); right: 18px; font-family: "Special Elite", monospace; font-size: 12px; color: #1a1a1a; text-decoration: none; letter-spacing: 0.1em; opacity: 0.55; padding: 6px 10px; z-index: 51; background: rgba(255,255,255,0.85); border-radius: 4px; transition: opacity 200ms ease; }
  .home-link:hover { opacity: 1; }
</style>
</head>
<body>
  <a class="home-link" href="index.html">⌂ home</a>
  <a class="back-link" href="index.html">← back</a>
  <div class="top-bar">
    <span class="title"><span class="live">LIVE</span> 그림일기</span>
    <div class="right-side">
      <span class="badge" id="usersBadge">— ONLINE</span>
      <button class="role-toggle" id="roleToggle">VISITOR</button>
    </div>
  </div>

  <div class="diary">
    <div class="diary-header">
      <div><span class="value" id="hYear">—</span><span class="label">年</span></div>
      <div><span class="value" id="hMonth">—</span><span class="label">月</span></div>
      <div><span class="value" id="hDay">—</span><span class="label">日</span></div>
      <div><span class="value" id="hWeek">—</span><span class="label">曜日</span></div>
      <div class="weather-grid" id="weatherGrid">
        <span class="w" data-w="sunny" title="晴">☀️</span>
        <span class="w" data-w="cloudy" title="曇">☁️</span>
        <span class="w" data-w="rainy" title="雨">☂️</span>
        <span class="w" data-w="snowy" title="雪">❄️</span>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <canvas id="canvas"></canvas>
      <div id="items-layer"></div>
      <div class="canvas-locked-overlay" id="lockedOverlay">
        <span>🔒 HOST 만 그림 그리기 가능 — 댓글로 참여해주세요</span>
      </div>
    </div>

    <!-- 호스트 캔버스 타이핑 — 제목 바로 위 -->
    <div class="host-canvas-input" id="hostCanvasInputBar" style="display:none;">
      <input class="comment-input" id="hostChatInput" placeholder="여기 바로 타이핑 → Enter (캔버스에 올라감)" style="flex:1; min-width:140px;" />
      <button class="btn primary" id="btnHostChatSend">SEND ▸</button>
    </div>

    <div class="title-bar">
      <span class="label">제목:</span>
      <input id="titleInput" type="text" placeholder="今日の일기 タイトル..." maxlength="80" disabled />
    </div>

    <div class="comments-area">
      <div class="comments-head">▾ 친구들의 코멘트</div>
      <div class="comments-list" id="commentsList"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tools-host show" id="toolsHost">
      <div class="row">
        <div class="colors" id="colors">
          <div class="color active" data-color="#1a1a1a" style="background:#1a1a1a"></div>
          <div class="color" data-color="#c8243a" style="background:#c8243a"></div>
          <div class="color" data-color="#ff5a8e" style="background:#ff5a8e"></div>
          <div class="color" data-color="#3a78d8" style="background:#3a78d8"></div>
          <div class="color" data-color="#f0b820" style="background:#f0b820"></div>
          <div class="color" data-color="#3aa867" style="background:#3aa867"></div>
        </div>
        <div class="sizes" id="sizes">
          <div class="size active" data-size="3"><span class="dot s1"></span></div>
          <div class="size" data-size="6"><span class="dot s2"></span></div>
          <div class="size" data-size="12"><span class="dot s3"></span></div>
        </div>
        <button class="btn" id="btnDraw" title="손그림 ON/OFF — 클릭해서 토글">✏️</button>
        <button class="btn" id="btnUndo" title="마지막 그림 한 획 지우기">↶</button>
        <button class="btn" id="btnEraser" title="지우개 모드 — 캔버스에서 문지르면 지워짐">🧽</button>
        <button class="btn" id="btnPhoto">📷</button>
        <button class="btn" id="btnText" title="원하는 위치에 붙이기">T</button>
        <button class="btn" id="btnNow" title="지금 화면 캡처 → picture diary에 올림" style="background:#c8243a; color:#fff; font-weight:700; letter-spacing:0.1em;">NOW!</button>
      </div>
    </div>
    <div class="tools-visitor" id="toolsVisitor">
      <div class="row">
        <input class="comment-input" id="commentInput" placeholder="質問やコメントを残す... / 댓글 / 質問" />
        <button class="btn" id="btnComPhoto">📷</button>
        <button class="btn" id="btnMapShare" title="지도 공유 (HOST 전용)">📍</button>
        <button class="btn primary" id="btnComSend">SEND</button>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" class="photo-input" />
  <input type="file" id="comPhotoInput" accept="image/*" class="photo-input" />

  <div class="modal-bg" id="enterModal">
    <div class="modal">
      <h2>WELCOME ✦</h2>
      <p style="font-size: 13px; color: #c8243a; margin: 4px 0 6px; font-weight: 700;">✦ 日本人女性専用スペース ✦</p>
      <p style="font-size: 11px; color: #888; margin: 0 0 12px; line-height:1.5;">参加するには下記情報の登録をお願いします<br/>참가하려면 아래 정보 등록이 필요합니다</p>
      <input type="text" id="regName" placeholder="お名前 / 성명" maxlength="40" />
      <input type="tel" id="regPhone" placeholder="電話番号 / 폰번호" maxlength="20" style="margin-top:6px;" />
      <input type="email" id="regEmail" placeholder="email" maxlength="80" style="margin-top:6px;" />
      <input type="text" id="nicknameInput" placeholder="nickname / ニックネーム" maxlength="20" style="margin-top:6px;" />
      <input type="password" id="regUserPw" placeholder="パスワード / 비밀번호 (4자 이상)" maxlength="40" style="margin-top:6px;" />
      <div style="display:flex; gap:18px; justify-content:center; align-items:center; margin: 10px 0; font-size: 14px; padding: 8px; background: #fdf6f7; border: 1px solid #f0d8d8; border-radius: 6px;">
        <label style="display:flex; gap:6px; align-items:center; cursor:pointer;">
          <input type="radio" name="gender" value="female" /> 女性
        </label>
        <label style="display:flex; gap:6px; align-items:center; cursor:pointer; opacity:0.7;">
          <input type="radio" name="gender" value="male" /> 男性
        </label>
      </div>
      <input type="password" id="hostPassword" placeholder="HOST 비밀번호 (관리자만)" maxlength="40" style="margin-top:4px; font-size: 13px;" />
      <p style="font-size: 10px; color: #999; margin: 4px 0 8px;">HOST 비번은 관리자 전용 (일반 사용자는 비워두세요)</p>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="btn" id="btnCancel" style="flex:1; padding:14px 12px; min-height:50px; background:#e8e4d8; color:#1a1a1a; font-size:15px;">캔슬</button>
        <button class="btn primary" id="btnEnter" style="flex:1; padding:14px 12px; min-height:50px; font-size:15px;">등록 ▸</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SB_URL = 'https://zhaabmqdbgmisyurcslv.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoYWFibXFkYmdtaXN5dXJjc2x2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwOTEyMTcsImV4cCI6MjA5MjY2NzIxN30.pcN8mQHPKhws2mMxeScDb3bc9rPJnZlYMRM23T8ksVE';
    const supabase = createClient(SB_URL, SB_KEY);

    // 클라이언트 상태

    const todayDate = new Date();
    const weekJp = ['日','月','火','水','木','金','土'][todayDate.getDay()];
    document.getElementById('hYear').textContent = todayDate.getFullYear();
    document.getElementById('hMonth').textContent = String(todayDate.getMonth() + 1).padStart(2, '0');
    document.getElementById('hDay').textContent = String(todayDate.getDate()).padStart(2, '0');
    document.getElementById('hWeek').textContent = weekJp;

    // Toast
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    // 역할 UI 적용
    function applyRole() {
      const isHost = role === 'host';
      document.getElementById('roleToggle').textContent = isHost ? 'HOST ✦' : 'VISITOR';
      document.getElementById('roleToggle').classList.toggle('host', isHost);
      // 그림 도구는 visitor도 사용 (그리기/색/사이즈/UNDO 공통). 호스트 전용 버튼은 클릭 시 차단됨.
      document.getElementById('toolsHost').classList.add('show');
      document.getElementById('toolsVisitor').classList.toggle('show', !isHost);
      document.getElementById('lockedOverlay').style.display = 'none';
      document.getElementById('canvasArea').style.cursor = 'crosshair';
      document.getElementById('canvas').style.pointerEvents = 'auto';
      document.getElementById('titleInput').disabled = !isHost;
      document.getElementById('hostCanvasInputBar').style.display = isHost ? 'flex' : 'none';
      document.querySelectorAll('.weather-grid .w').forEach(w => {
        w.style.cursor = isHost ? 'pointer' : 'default';
      });
    }
    document.getElementById('roleToggle').addEventListener('click', () => {
      role = role === 'host' ? 'visitor' : 'host';
      localStorage.setItem('mj_role', role);
      applyRole();
      toast(role === 'host' ? 'HOST 모드 — 그림/제목 편집 가능' : 'VISITOR 모드 — 댓글로 참여');
    });

    // Canvas
    const canvas = document.getElementById('canvas');
    const canvasArea = document.getElementById('canvasArea');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    function resizeCanvas() {
      const rect = document.getElementById('canvasArea').getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    let allStrokes = [];
    function drawStroke(s) {
      const p = s.path; if (!p || p.length < 2) return;
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
      const w = canvas.width / dpr, h = canvas.height / dpr;
      // 점 사이 거리가 임계값 넘으면 새 path (지우개로 끊긴 부분 자연스럽게)
      // 빠른 손가락 동작 시 정상 stroke가 끊기지 않도록 임계값 크게 (15%)
      const GAP = 0.15;
      ctx.beginPath();
      ctx.moveTo(p[0].x * w, p[0].y * h);
      for (let i = 1; i < p.length; i++) {
        const dx = p[i].x - p[i-1].x;
        const dy = p[i].y - p[i-1].y;
        if (Math.hypot(dx, dy) > GAP) {
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(p[i].x * w, p[i].y * h);
        } else {
          ctx.lineTo(p[i].x * w, p[i].y * h);
        }
      }
      ctx.stroke();
    }
    function redraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); allStrokes.forEach(drawStroke); }

    let drawing = false, currentColor = '#1a1a1a', currentSize = 3, currentPath = [];
    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height };
    }
    let eraserMode = false;
    let erasing = false;
    let drawingMode = false; // 손그림 토글 — 기본 OFF (지우개와 같은 패턴)
    const eraseQueue = new Set();
    canvasArea.addEventListener('mousedown', e => {
      e.preventDefault();
      if (role === 'host' && eraserMode) { erasing = true; eraseAt(getPos(e)); return; }
      if (!drawingMode) return; // 손그림 OFF면 그림 안 그림
      drawing = true; currentPath = [getPos(e)];
    });
    canvasArea.addEventListener('touchstart', e => {
      e.preventDefault();
      if (role === 'host' && eraserMode) { erasing = true; eraseAt(getPos(e)); return; }
      if (!drawingMode) return;
      drawing = true; currentPath = [getPos(e)];
    }, { passive: false });
    function moveDraw(e) {
      if (eraserMode && !erasing) {
        // 지우개 모드일 때 커서 따라다니기 (드래그 아닐 때도)
        const p = getPos(e);
        moveEraserCursor(p);
      }
      if (erasing) { e.preventDefault(); const p = getPos(e); moveEraserCursor(p); eraseAt(p); return; }
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e); currentPath.push(p);
      const w = canvas.width / dpr, h = canvas.height / dpr;
      ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
      ctx.beginPath();
      const last = currentPath[currentPath.length - 2];
      ctx.moveTo(last.x * w, last.y * h); ctx.lineTo(p.x * w, p.y * h); ctx.stroke();
    }
    canvasArea.addEventListener('mousemove', moveDraw);
    canvasArea.addEventListener('touchmove', moveDraw, { passive: false });
    async function endDraw() {
      if (!drawing) return; drawing = false;
      if (currentPath.length < 2) return;
      const stroke = { session_date: today, path: currentPath, color: currentColor, size: currentSize, client_id: clientId };
      const { data, error } = await supabase.from('diary_strokes').insert(stroke).select().single();
      if (data) allStrokes.push(data);
      currentPath = [];
    }
    canvasArea.addEventListener('mouseup', () => { endDraw(); endErase(); });
    canvasArea.addEventListener('mouseleave', () => { endDraw(); endErase(); hideEraserCursor(); });
    canvasArea.addEventListener('touchend', () => { endDraw(); endErase(); hideEraserCursor(); });

    // 섬세 지우개 — 손가락 위치에 닿은 점만 제거 (stroke 일부만 지워짐)
    // visitor는 자기 stroke만, host는 모든 stroke 지움
    const dirtyStrokes = new Set();
    const ERASER_R = 0.06; // 캔버스 6% 반경 (두꺼움)
    function eraseAt(p) {
      const R = ERASER_R;
      let changed = false;
      for (let i = allStrokes.length - 1; i >= 0; i--) {
        const s = allStrokes[i];
        if (!s.path || !s.path.length) continue;
        if (role !== 'host' && s.client_id !== clientId) continue; // 남의 그림은 visitor가 못 지움
        const before = s.path.length;
        s.path = s.path.filter(pt => Math.hypot(pt.x - p.x, pt.y - p.y) > R);
        if (s.path.length !== before) {
          dirtyStrokes.add(s.id);
          changed = true;
        }
      }
      if (changed) redraw();
    }
    async function endErase() {
      if (!erasing) return;
      erasing = false;
      if (dirtyStrokes.size === 0) return;
      const ids = [...dirtyStrokes];
      dirtyStrokes.clear();
      // 각 stroke 처리: 점 거의 없으면 delete, 남으면 path update
      for (const id of ids) {
        const stroke = allStrokes.find(s => s.id === id);
        if (!stroke || !stroke.path || stroke.path.length < 2) {
          // 거의 다 지워짐 → 완전 삭제
          allStrokes = allStrokes.filter(s => s.id !== id);
          await supabase.from('diary_strokes').delete().eq('id', id);
        } else {
          // 일부만 지워짐 → path 업데이트
          await supabase.from('diary_strokes').update({ path: stroke.path }).eq('id', id);
        }
      }
    }
    // 지우개 모드 토글
    const btnEraser = document.getElementById('btnEraser');
    btnEraser.addEventListener('click', () => {
      eraserMode = !eraserMode;
      btnEraser.classList.toggle('primary', eraserMode);
      if (eraserMode) {
        textMode = false;
        if (btnText) btnText.classList.remove('primary');
        drawingMode = false;
        btnDraw.classList.remove('primary');
      } else {
        hideEraserCursor();
      }
      toast(eraserMode ? '🧽 지우개 ON — 두꺼운 영역으로 문지르면 지워짐' : '지우개 OFF');
    });

    // NOW! 버튼 — 현재 화면 캡처 → picture diary에 업로드
    document.getElementById('btnNow').addEventListener('click', async () => {
      if (role !== 'host') return toast('HOST 만 NOW! 사용 가능');
      if (typeof html2canvas === 'undefined') return toast('캡처 라이브러리 로딩 중...');
      toast('📸 캡처 중...');
      try {
        const target = document.querySelector('.diary');
        const cv = await html2canvas(target, {
          backgroundColor: '#ffffff',
          useCORS: true,
          allowTaint: true,
          scale: 1,
          logging: false
        });
        // 600px max width로 리사이즈 + 더 강한 압축
        const maxW = 600;
        const ratio = Math.min(maxW / cv.width, maxW / cv.height, 1);
        const out = document.createElement('canvas');
        out.width = cv.width * ratio; out.height = cv.height * ratio;
        out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
        const b64 = out.toDataURL('image/jpeg', 0.72);
        // type='photo'로 저장 + magic pos_x: -999로 snapshot 식별
        const { error } = await supabase.from('diary_items').insert({
          session_date: today,
          type: 'photo',
          content: b64,
          pos_x: -999, pos_y: -999,
          rotation: 0,
          client_id: clientId,
          nickname: nickname || null
        }).select().single();
        if (error) {
          toast('업로드 실패: ' + (error.message || ''));
          console.error('NOW upload err', error);
        } else {
          toast('📸 picture diary에 올라감 ✓');
        }
      } catch (e) {
        toast('캡처 실패: ' + e.message);
        console.error('NOW capture err', e);
      }
    });

    // 손그림 모드 토글
    const btnDraw = document.getElementById('btnDraw');
    btnDraw.addEventListener('click', () => {
      drawingMode = !drawingMode;
      btnDraw.classList.toggle('primary', drawingMode);
      if (drawingMode) {
        eraserMode = false;
        btnEraser.classList.remove('primary');
        textMode = false;
        if (btnText) btnText.classList.remove('primary');
      }
      toast(drawingMode ? '✏️ 손그림 ON' : '손그림 OFF');
    });

    document.querySelectorAll('.color').forEach(el => el.addEventListener('click', () => {
      document.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
      el.classList.add('active'); currentColor = el.dataset.color;
    }));
    document.querySelectorAll('.size').forEach(el => el.addEventListener('click', () => {
      document.querySelectorAll('.size').forEach(c => c.classList.remove('active'));
      el.classList.add('active'); currentSize = parseInt(el.dataset.size);
    }));

    // 텍스트 입력 모드
    let textMode = false;
    const btnText = document.getElementById('btnText');
    btnText.addEventListener('click', () => {
      if (role !== 'host') return toast('HOST 만 사용 가능');
      textMode = !textMode;
      btnText.classList.toggle('primary', textMode);
      canvas.style.cursor = textMode ? 'text' : 'crosshair';
      if (textMode) toast('텍스트 채팅 모드 ON — 캔버스 아무 곳이나 클릭해서 입력. ESC로 종료.');
      else toast('텍스트 모드 OFF');
    });

    // 채팅처럼 바로 타이핑 — 캔버스에 자동으로 자리잡음
    const hostChatInput = document.getElementById('hostChatInput');
    const btnHostChatSend = document.getElementById('btnHostChatSend');
    let chatNotePos = 0; // 자리 위치 카운터
    async function sendHostChat() {
      if (role !== 'host') return toast('HOST 모드에서만 가능');
      const txt = hostChatInput.value.trim();
      if (!txt) return;
      // 겹침 방지 — 현재 캔버스에 있는 노트 갯수 기준으로 다음 자리 계산
      chatNotePos = itemsLayer.querySelectorAll('.item.note').length;
      const col = Math.floor(chatNotePos / 14);
      const row = chatNotePos % 14;
      const px = Math.min(0.05 + col * 0.32, 0.7);
      const py = 0.06 + row * 0.065;
      const item = {
        session_date: today, type: 'note', content: txt,
        pos_x: px, pos_y: py, rotation: 0,
        client_id: clientId, nickname: nickname || null
      };
      hostChatInput.value = '';
      const { data } = await supabase.from('diary_items').insert(item).select().single();
      if (data) renderItem(data);
    }
    btnHostChatSend.addEventListener('click', sendHostChat);
    hostChatInput.addEventListener('keydown', (e) => {
      // IME(한글/일본어) 변환 중 Enter는 무시 — 변환 확정용 Enter가 sendHostChat까지 발동되는 중복 방지
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        sendHostChat();
      }
    });

    // UNDO — 마지막 내가 그은 stroke 한 획 지우기
    const btnUndo = document.getElementById('btnUndo');
    btnUndo.addEventListener('click', async () => {
      // 자기가 그린 마지막 stroke만 지움 (host/visitor 둘 다 자기 그림은 지우기 가능)
      // 내가 그린 마지막 stroke 찾기
      const mine = allStrokes.filter(s => s.client_id === clientId);
      if (mine.length === 0) return toast('지울 그림이 없어요');
      const last = mine[mine.length - 1];
      const { error } = await supabase.from('diary_strokes').delete().eq('id', last.id);
      if (error) { toast('지우기 실패: ' + error.message); return; }
      // 로컬에서도 즉시 제거 (realtime 안 와도 바로 반영)
      allStrokes = allStrokes.filter(s => s.id !== last.id);
      redraw();
    });

    // 캔버스 클릭 → 텍스트 입력 (텍스트 모드일 때만)
    let textInputEl = null;
    canvasArea.addEventListener('click', (e) => {
      if (!textMode || role !== 'host') return;
      if (e.target.closest('.item')) return; // 사진/노트 클릭은 무시
      e.preventDefault();
      e.stopPropagation();
      if (textInputEl) { textInputEl.remove(); textInputEl = null; }
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      textInputEl = document.createElement('input');
      textInputEl.type = 'text';
      textInputEl.placeholder = '텍스트 입력 후 Enter';
      textInputEl.maxLength = 60;
      Object.assign(textInputEl.style, {
        position: 'absolute',
        left: (px * 100) + '%',
        top: (py * 100) + '%',
        transform: 'translate(-50%, -50%)',
        background: 'rgba(255,255,255,0.95)',
        border: '1px solid ' + currentColor,
        padding: '4px 8px',
        fontSize: (currentSize * 4 + 12) + 'px',
        color: currentColor,
        outline: 'none',
        zIndex: 100,
        userSelect: 'text',
        WebkitUserSelect: 'text',
        fontFamily: 'inherit',
        minWidth: '120px'
      });
      document.getElementById('canvasArea').appendChild(textInputEl);
      setTimeout(() => textInputEl.focus(), 50);
      textInputEl.addEventListener('keydown', async (ke) => {
        if (ke.key === 'Enter') {
          const txt = textInputEl.value.trim();
          if (!txt) { textInputEl.remove(); textInputEl = null; return; }
          const item = {
            session_date: today, type: 'note', content: txt,
            pos_x: px, pos_y: py, rotation: 0,
            client_id: clientId, nickname: nickname || null
          };
          const { data } = await supabase.from('diary_items').insert(item).select().single();
          if (data) renderItem(data);
          textInputEl.remove(); textInputEl = null;
          // textMode 유지 — 채팅처럼 계속 입력 가능. ESC 또는 T 다시 누르면 종료.
        } else if (ke.key === 'Escape') {
          textInputEl.remove(); textInputEl = null;
          textMode = false;
          btnText.classList.remove('primary');
          canvas.style.cursor = 'crosshair';
          toast('텍스트 모드 OFF');
        }
      });
      textInputEl.addEventListener('blur', () => {
        setTimeout(() => { if (textInputEl) { textInputEl.remove(); textInputEl = null; } }, 150);
      });
    });

    // 사진 업로드 (메인 영역, host 전용)
    const photoInput = document.getElementById('photoInput');
    document.getElementById('btnPhoto').addEventListener('click', () => {
      if (role !== 'host') return toast('HOST 만 사진 추가 가능');
      photoInput.click();
    });
    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const b64 = await fileToBase64Resized(file, 600);
      const item = {
        session_date: today, type: 'photo', content: b64,
        pos_x: 0.3 + Math.random() * 0.4, pos_y: 0.3 + Math.random() * 0.4,
        rotation: (Math.random() - 0.5) * 14, client_id: clientId, nickname: nickname || null
      };
      const { data, error } = await supabase.from('diary_items').insert(item).select().single();
      if (data) { renderItem(data); toast('사진 업로드 완료 ✓'); }
      photoInput.value = '';
    });

    function fileToBase64Resized(file, maxW) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onload = async (ev) => {
          const img = new Image(); img.src = ev.target.result; await img.decode();
          const ratio = Math.min(maxW / img.width, maxW / img.height, 1);
          const c = document.createElement('canvas');
          c.width = img.width * ratio; c.height = img.height * ratio;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          // PNG는 PNG로 (알파 보존), 그 외는 JPEG로 압축
          const isPng = file.type === 'image/png' || /\.png$/i.test(file.name || '');
          if (isPng) {
            resolve(c.toDataURL('image/png'));
          } else {
            resolve(c.toDataURL('image/jpeg', 0.78));
          }
        };
        r.readAsDataURL(file);
      });
    }

    // 아이템 렌더 (캔버스 위 사진)
    const itemsLayer = document.getElementById('items-layer');
    const renderedItems = new Set();
    function renderItem(item) {
      if (renderedItems.has(item.id)) return;
      // snapshot은 캔버스에 표시 안 함 (picture diary 전용) — type='snapshot' 또는 pos_x<0 magic
      if (item.type === 'snapshot' || item.pos_x < 0) { renderedItems.add(item.id); return; }
      renderedItems.add(item.id);
      const el = document.createElement('div');
      el.className = 'item ' + item.type;
      el.dataset.itemId = item.id;
      el.style.left = (item.pos_x * 100) + '%'; el.style.top = (item.pos_y * 100) + '%';
      if (item.type === 'photo') {
        const initRot = item.rotation || 0;
        const initScale = item.scale || 1;
        el.style.transform = `translate(-50%, -50%) rotate(${initRot}deg) scale(${initScale})`;
        el.innerHTML = `<img src="${item.content}" />`;
      } else if (item.type === 'note') {
        // 캔버스 텍스트 — 자동 줄바꿈 X, 사용자가 명시한 \n 만 줄바꿈
        el.style.transform = `rotate(${item.rotation || 0}deg)`;
        el.style.fontSize = '15px';
        el.style.fontFamily = '"Hachi Maru Pop", "Zen Kaku Gothic New", sans-serif';
        el.style.color = '#1a1a1a';
        el.style.maxWidth = 'none';
        el.style.lineHeight = '1.4';
        el.style.padding = '2px 4px';
        el.style.whiteSpace = 'pre';
        el.style.wordBreak = 'normal';
        el.textContent = item.content;
      }
      // 호스트면 모든 항목 — 드래그 위치 이동 + 탭 시 X 표시 토글 (디바이스 무관)
      if (role === 'host') {
        el.style.position = 'absolute';
        el.style.cursor = 'move';
        el.style.touchAction = 'none';

        // X 버튼 (기본 숨김, 탭 시 표시) — 이미지 우상단 바로 옆 + 큰 터치 영역
        const x = document.createElement('span');
        x.className = 'x-mark';
        x.textContent = '×';
        Object.assign(x.style, {
          position: 'absolute', top: '2px', right: '2px',
          width: '36px', height: '36px', borderRadius: '50%',
          background: '#c8243a', color: '#fff',
          fontSize: '20px', lineHeight: '36px', textAlign: 'center',
          cursor: 'pointer', display: 'none', zIndex: '25',
          fontFamily: 'sans-serif', fontWeight: 'bold',
          boxShadow: '0 3px 10px rgba(0,0,0,0.35)',
          touchAction: 'manipulation',
          userSelect: 'none', WebkitUserSelect: 'none',
          border: '2px solid #fff'
        });
        el.appendChild(x);
        const removeItem = async (ev) => {
          ev.stopPropagation(); ev.preventDefault();
          if (!confirm('이 항목을 지울까요?')) return;
          const { error } = await supabase.from('diary_items').delete().eq('id', item.id);
          if (error) { toast('삭제 실패: ' + error.message); return; }
          el.remove();
          renderedItems.delete(item.id);
        };
        x.addEventListener('click', removeItem);
        x.addEventListener('touchstart', (ev) => { ev.stopPropagation(); }, { passive: true });
        x.addEventListener('touchend', removeItem, { passive: false });

        // 드래그 + 탭 + 핀치(2손가락 사이즈/회전) 구분
        let dragging = false, dragStart = null, didMove = false;
        let pinching = false, pinchStart = null;
        function startDrag(e) {
          if (e.target.closest('button') || e.target.closest('.x-mark') || e.target.closest('.photo-ctrl')) return;
          // 손그림/지우개 모드면 이미지 클릭 무시 → 캔버스로 통과해서 그림 그릴 수 있게
          if (drawingMode || eraserMode) return;

          // 두 손가락 → 핀치 (사진만). 드래그 중이어도 두 손가락이면 핀치로 전환
          if (e.touches && e.touches.length >= 2 && item.type === 'photo') {
            // 드래그 중이었으면 정리
            if (dragging) {
              dragging = false;
              document.removeEventListener('mousemove', moveDrag);
              document.removeEventListener('touchmove', moveDrag);
              document.removeEventListener('mouseup', endDrag);
              document.removeEventListener('touchend', endDrag);
            }
            e.preventDefault(); e.stopPropagation();
            pinching = true; dragging = false;
            const [t1, t2] = e.touches;
            pinchStart = {
              dist: Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY),
              angle: Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI,
              scale: item.scale || 1,
              rotation: item.rotation || 0
            };
            document.addEventListener('touchmove', movePinch, { passive: false });
            document.addEventListener('touchend', endPinch);
            return;
          }

          e.preventDefault(); e.stopPropagation();
          dragging = true; didMove = false;
          const t = e.touches ? e.touches[0] : e;
          dragStart = { x: t.clientX, y: t.clientY, px: item.pos_x, py: item.pos_y };
          document.addEventListener('mousemove', moveDrag);
          document.addEventListener('touchmove', moveDrag, { passive: false });
          document.addEventListener('mouseup', endDrag);
          document.addEventListener('touchend', endDrag);
        }
        function movePinch(e) {
          if (!pinching || !e.touches || e.touches.length < 2) return;
          e.preventDefault();
          const [t1, t2] = e.touches;
          const newDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          const newAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;
          const scaleFactor = newDist / pinchStart.dist;
          item.scale = Math.max(0.3, Math.min(4, pinchStart.scale * scaleFactor));
          item.rotation = pinchStart.rotation + (newAngle - pinchStart.angle);
          el.style.transform = `translate(-50%, -50%) rotate(${item.rotation}deg) scale(${item.scale})`;
        }
        async function endPinch() {
          if (!pinching) return;
          pinching = false;
          document.removeEventListener('touchmove', movePinch);
          document.removeEventListener('touchend', endPinch);
          const { error } = await supabase.from('diary_items').update({
            rotation: item.rotation, scale: item.scale
          }).eq('id', item.id);
          if (error && /scale/i.test(error.message || '')) {
            await supabase.from('diary_items').update({ rotation: item.rotation }).eq('id', item.id);
          }
        }
        function moveDrag(e) {
          if (!dragging) return;
          e.preventDefault();
          const t = e.touches ? e.touches[0] : e;
          // 8px 이상 이동했을 때만 드래그로 인식 (그 이하는 탭)
          const totalMove = Math.hypot(t.clientX - dragStart.x, t.clientY - dragStart.y);
          if (totalMove > 8) didMove = true;
          if (!didMove) return; // 탭 단계에선 위치 업데이트 안 함
          const r = document.getElementById('canvasArea').getBoundingClientRect();
          const ndx = (t.clientX - dragStart.x) / r.width;
          const ndy = (t.clientY - dragStart.y) / r.height;
          item.pos_x = Math.max(0, Math.min(1, dragStart.px + ndx));
          item.pos_y = Math.max(0, Math.min(1, dragStart.py + ndy));
          el.style.left = (item.pos_x * 100) + '%';
          el.style.top = (item.pos_y * 100) + '%';
          // transform 명시적 유지 — 위치 변경 시 사이즈/회전 보존
          const sc = item.scale || 1;
          const rot = item.rotation || 0;
          if (item.type === 'photo') {
            el.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(${sc})`;
          } else {
            el.style.transform = `rotate(${rot}deg)`;
          }
        }
        async function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          document.removeEventListener('mousemove', moveDrag);
          document.removeEventListener('touchmove', moveDrag);
          document.removeEventListener('mouseup', endDrag);
          document.removeEventListener('touchend', endDrag);
          if (didMove) {
            // 위치 변경 → DB sync
            await supabase.from('diary_items').update({ pos_x: item.pos_x, pos_y: item.pos_y }).eq('id', item.id);
          } else {
            // 그냥 탭 → 다른 항목 X 모두 숨김 + 이 항목 X 토글
            document.querySelectorAll('.canvas-area .x-mark').forEach(m => {
              if (m !== x) m.style.display = 'none';
            });
            // 사진 컨트롤도 토글
            document.querySelectorAll('.canvas-area .photo-ctrl').forEach(c => {
              if (c.parentElement !== el) c.style.display = 'none';
            });
            x.style.display = (x.style.display === 'block') ? 'none' : 'block';
            const myCtrl = el.querySelector('.photo-ctrl');
            if (myCtrl) myCtrl.style.display = (x.style.display === 'block') ? 'flex' : 'none';
          }
        }
        el.addEventListener('mousedown', startDrag);
        el.addEventListener('touchstart', startDrag, { passive: false });
      }

      // 호스트면 모든 사진 — 사이즈/회전 컨트롤 (탭 시 같이 표시)
      if (item.type === 'photo' && role === 'host') {
        const ctrl = document.createElement('div');
        ctrl.className = 'photo-ctrl';
        Object.assign(ctrl.style, {
          position: 'absolute', bottom: '4px', left: '50%',
          transform: 'translateX(-50%)',
          display: 'none', gap: '3px', zIndex: '30',
          background: 'rgba(0,0,0,0.85)', padding: '4px 5px', borderRadius: '8px',
          boxShadow: '0 3px 8px rgba(0,0,0,0.3)',
          pointerEvents: 'auto'
        });
        const mkBtn = (label) => {
          const b = document.createElement('button');
          b.textContent = label;
          Object.assign(b.style, {
            width: '44px', height: '44px', border: '0',
            background: 'rgba(255,255,255,0.95)', color: '#1a1a1a',
            borderRadius: '6px', cursor: 'pointer',
            fontSize: '18px', fontFamily: 'sans-serif', fontWeight: '700',
            lineHeight: '1', padding: '0', touchAction: 'manipulation',
            WebkitTapHighlightColor: 'rgba(0,0,0,0.1)'
          });
          // 폰에서 click 안 잡히는 경우 대비 — touchstart에서 stopPropagation, touchend에서 click 트리거
          b.addEventListener('touchstart', (ev) => { ev.stopPropagation(); }, { passive: true });
          return b;
        };
        const bDown = mkBtn('－'), bUp = mkBtn('＋'), bRotL = mkBtn('↶'), bRotR = mkBtn('↷');
        ctrl.append(bDown, bUp, bRotL, bRotR);
        el.appendChild(ctrl);

        async function applyTransform(updates) {
          if ('rotation' in updates) item.rotation = updates.rotation;
          if ('scale' in updates) item.scale = updates.scale;
          const sc = item.scale || 1;
          const rot = item.rotation || 0;
          el.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(${sc})`;
          const { error } = await supabase.from('diary_items').update(updates).eq('id', item.id);
          if (error && /column.*scale|scale.*does not exist/i.test(error.message || '')) {
            // scale 컬럼이 DB에 없음 — rotation만 다시 저장
            if ('rotation' in updates) {
              await supabase.from('diary_items').update({ rotation: updates.rotation }).eq('id', item.id);
            }
            if ('scale' in updates) toast('사이즈는 일시적 (Supabase에 scale 컬럼 추가 필요)');
          } else if (error) {
            console.error('photo transform err', error);
          }
        }
        const onUp = e => { e.stopPropagation(); e.preventDefault(); applyTransform({ scale: Math.min((item.scale || 1) + 0.25, 4) }); };
        const onDown = e => { e.stopPropagation(); e.preventDefault(); applyTransform({ scale: Math.max((item.scale || 1) - 0.25, 0.3) }); };
        const onRotL = e => { e.stopPropagation(); e.preventDefault(); applyTransform({ rotation: (item.rotation || 0) - 22 }); };
        const onRotR = e => { e.stopPropagation(); e.preventDefault(); applyTransform({ rotation: (item.rotation || 0) + 22 }); };
        bUp.addEventListener('click', onUp);
        bDown.addEventListener('click', onDown);
        bRotL.addEventListener('click', onRotL);
        bRotR.addEventListener('click', onRotR);
        // iOS Safari 보강 — touchend에서도 직접 발동
        bUp.addEventListener('touchend', onUp, { passive: false });
        bDown.addEventListener('touchend', onDown, { passive: false });
        bRotL.addEventListener('touchend', onRotL, { passive: false });
        bRotR.addEventListener('touchend', onRotR, { passive: false });
      }
      itemsLayer.appendChild(el);
    }

    // 제목 (diary_main)
    const titleInput = document.getElementById('titleInput');
    let titleSaveTimer;
    titleInput.addEventListener('input', () => {
      clearTimeout(titleSaveTimer);
      titleSaveTimer = setTimeout(saveTitle, 600);
    });
    async function saveTitle() {
      const v = titleInput.value;
      await supabase.from('diary_main').upsert({ session_date: today, title: v, client_id: clientId, updated_at: new Date().toISOString() });
    }

    // 날씨
    document.querySelectorAll('.weather-grid .w').forEach(el => {
      el.addEventListener('click', async () => {
        if (role !== 'host') return;
        document.querySelectorAll('.weather-grid .w').forEach(w => w.classList.remove('active'));
        el.classList.add('active');
        await supabase.from('diary_main').upsert({ session_date: today, weather: el.dataset.w, client_id: clientId, updated_at: new Date().toISOString() });
      });

    // 댓글 렌더
    const commentsList = document.getElementById('commentsList');
    const renderedComments = new Set();
    function renderComment(c) {
      if (renderedComments.has(c.id)) return;
      renderedComments.add(c.id);
      const el = document.createElement('div');
      el.className = 'comment ' + c.type + ' ' + (c.client_id === clientId ? 'own' : 'other');
      const time = new Date(c.created_at).toTimeString().slice(0, 5);
      let body = '';
      if (c.type === 'text' && c.content.startsWith('[map]')) {
        // 지도 카드
        const raw = c.content.slice(5); // remove [map]
        const sep = raw.indexOf('||');
        const label = sep > -1 ? raw.slice(0, sep) : raw;
        const url = sep > -1 ? raw.slice(sep + 2) : raw;
        const safeLabel = label.replace(/</g,'&lt;');
        const safeUrl = url.replace(/"/g,'&quot;');
        const isNaver = /naver\.(me|com)/i.test(url);
        const provider = isNaver ? '네이버지도' : '구글지도';
        const provColor = isNaver ? '#03c75a' : '#4285f4';
        body = `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="display:flex; gap:10px; align-items:center; padding:10px 12px; background:rgba(255,255,255,0.7); border:1px solid rgba(0,0,0,0.08); border-radius:8px; text-decoration:none; color:inherit;">
          <span style="font-size:22px; line-height:1;">📍</span>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600; font-size:13px; color:#1a1a1a; word-break:break-word;">${safeLabel}</div>
            <div style="font-size:10px; color:${provColor}; margin-top:2px; letter-spacing:0.04em;">${provider} 열기 →</div>
          </div>
        </a>`;
      } else if (c.type === 'text') body = c.content.replace(/</g,'&lt;').replace(/\n/g,'<br/>');
      else if (c.type === 'photo') body = `<img src="${c.content}" />`;
      else if (c.type === 'drawing') body = `<canvas data-strokes='${c.content}' width="280" height="200"></canvas>`;
      el.innerHTML = `<div class="meta"><span class="name">@${c.nickname || 'guest'}</span><span>${time}</span></div>${body}`;
      // host만 X 삭제 가능 — 기본 숨김, 댓글 탭 시 표시
      if (role === 'host') {
        el.style.position = 'relative';
        el.style.cursor = 'pointer';
        const cx = document.createElement('span');
        cx.className = 'comment-x-mark';
        cx.textContent = '×';
        Object.assign(cx.style, {
          position: 'absolute', top: '4px', right: '6px',
          width: '22px', height: '22px', borderRadius: '50%',
          background: '#c8243a', color: '#fff',
          fontSize: '13px', lineHeight: '22px', textAlign: 'center',
          cursor: 'pointer', display: 'none', zIndex: '10',
          fontFamily: 'sans-serif', fontWeight: 'bold',
          boxShadow: '0 2px 6px rgba(0,0,0,0.25)',
          touchAction: 'manipulation'
        });
        el.appendChild(cx);
        // 댓글 탭 → X 토글 (다른 댓글 X 자동 숨김)
        el.addEventListener('click', (ev) => {
          if (ev.target === cx) return; // X 자체 클릭은 별도 핸들러
          if (ev.target.closest('a')) return; // 지도/링크 카드 탭은 무시
          document.querySelectorAll('.comment-x-mark').forEach(m => {
            if (m !== cx) m.style.display = 'none';
          });
          cx.style.display = (cx.style.display === 'block') ? 'none' : 'block';
        });
        cx.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          if (!confirm('이 댓글을 지울까요?')) return;
          const { error } = await supabase.from('diary_comments').delete().eq('id', c.id);
          if (error) { toast('삭제 실패: ' + error.message); return; }
          el.remove();
          renderedComments.delete(c.id);
        });
      }
      commentsList.appendChild(el);
      // 그림 댓글 그리기
      if (c.type === 'drawing') {
        const cv = el.querySelector('canvas');
        const cctx = cv.getContext('2d');
        const strokes = JSON.parse(c.content);
        strokes.forEach(s => {
          cctx.strokeStyle = s.color; cctx.lineWidth = s.size;
          cctx.lineCap = 'round'; cctx.lineJoin = 'round';
          cctx.beginPath();
          if (!s.path || !s.path.length) return;
          cctx.moveTo(s.path[0].x * cv.width, s.path[0].y * cv.height);
          for (let i = 1; i < s.path.length; i++) cctx.lineTo(s.path[i].x * cv.width, s.path[i].y * cv.height);
          cctx.stroke();
        });
      }
      // 5개 초과하면 가장 오래된 거 위로 사라지게
      const items = commentsList.querySelectorAll('.comment:not(.leaving)');
      if (items.length > 5) {
        const overflow = items.length - 5;
        for (let i = 0; i < overflow; i++) {
          const oldest = items[i];
          oldest.classList.add('leaving');
          setTimeout(() => oldest.remove(), 340);
        }
      }
      // 자동 스크롤 (보통은 5개 제한이라 안 필요하지만 안전장치)
      const nearBottom = (commentsList.scrollHeight - commentsList.clientHeight - commentsList.scrollTop) < 80;
      if (nearBottom) {
        commentsList.scrollTop = commentsList.scrollHeight;
      }
    }

    // 댓글 보내기
    const commentInput = document.getElementById('commentInput');
    document.getElementById('btnComSend').addEventListener('click', sendTextComment);
    commentInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendTextComment(); });

    // 지도 공유 (HOST 전용)
    document.getElementById('btnMapShare').addEventListener('click', async () => {
      if (role !== 'host') return toast('HOST 만 지도 공유 가능');
      const input = prompt('장소 이름 또는 지도 URL\n(예: 안다즈 강남, https://naver.me/abc)');
      if (!input) return;
      const trimmed = input.trim();
      let url, label;
      if (/^https?:\/\//i.test(trimmed)) {
        url = trimmed;
        try { label = decodeURIComponent(trimmed.replace(/^https?:\/\//, '').split(/[?#]/)[0]); }
        catch { label = trimmed; }
      } else {
        label = trimmed;
        url = 'https://map.naver.com/p/search/' + encodeURIComponent(trimmed);
      }
      const c = {
        session_date: today,
        type: 'text',
        content: '[map]' + label + '||' + url,
        client_id: clientId,
        nickname: nickname || null
      };
      const { data, error } = await supabase.from('diary_comments').insert(c).select().single();
      if (data) renderComment(data);
      else toast('지도 공유 실패: ' + (error?.message || ''));
    });
    async function sendTextComment() {
      const v = commentInput.value.trim(); if (!v) return;
      const c = { session_date: today, type: 'text', content: v, client_id: clientId, nickname: nickname || null };
      const { data, error } = await supabase.from('diary_comments').insert(c).select().single();
      if (data) { renderComment(data); commentInput.value = ''; }
      else toast('댓글 실패: ' + (error?.message || 'unknown'));
      console.log('[comment]', { data, error });
    }

    // 댓글 사진
    const comPhotoInput = document.getElementById('comPhotoInput');
    document.getElementById('btnComPhoto').addEventListener('click', () => comPhotoInput.click());
    comPhotoInput.addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const b64 = await fileToBase64Resized(f, 800);
      const c = { session_date: today, type: 'photo', content: b64, client_id: clientId, nickname: nickname || null };
      const { data, error } = await supabase.from('diary_comments').insert(c).select().single();
      if (data) { renderComment(data); toast('사진 댓글 ✓'); }
      comPhotoInput.value = '';
    });

    // 초기 로드
    async function loadAll() {
      const [{ data: strokes }, { data: items }, { data: main }, { data: comments }] = await Promise.all([
        supabase.from('diary_strokes').select('*').eq('session_date', today).order('created_at'),
        supabase.from('diary_items').select('*').eq('session_date', today).order('created_at'),
        supabase.from('diary_main').select('*').eq('session_date', today).maybeSingle(),
        supabase.from('diary_comments').select('*').eq('session_date', today).order('created_at')
      ]);
      allStrokes = strokes || []; redraw();
      (items || []).forEach(renderItem);
      if (main) {
        titleInput.value = main.title || '';
        if (main.weather) {
          const w = document.querySelector(`.weather-grid .w[data-w="${main.weather}"]`);
          if (w) w.classList.add('active');
        }
      }
      (comments || []).forEach(renderComment);
    }

    // 화면의 item element 위치/사이즈/회전 업데이트 (UPDATE 이벤트 + polling 공용)
    function updateItemPosition(it) {
      const el = document.querySelector(`.item[data-item-id="${it.id}"]`);
      if (!el) return;
      el.style.left = (it.pos_x * 100) + '%';
      el.style.top = (it.pos_y * 100) + '%';
      if (it.type === 'photo') {
        const sc = it.scale || 1;
        const rot = it.rotation || 0;
        el.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(${sc})`;
      } else if (it.type === 'note') {
        el.style.transform = `rotate(${it.rotation || 0}deg)`;
      }
    }

    // 실시간
    function subscribeRealtime() {
      supabase.channel('live-' + today)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'diary_strokes', filter: `session_date=eq.${today}` },
          (p) => { if (p.new.client_id === clientId) return; allStrokes.push(p.new); drawStroke(p.new); })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'diary_strokes' },
          (p) => { allStrokes = allStrokes.filter(s => s.id !== p.old.id); redraw(); })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'diary_items', filter: `session_date=eq.${today}` },
          (p) => renderItem(p.new))
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'diary_items', filter: `session_date=eq.${today}` },
          (p) => {
            // 자기 디바이스에서 발생한 변경은 무시 (자기 드래그 중 자기에게 reset 방지)
            if (p.new.client_id === clientId) return;
            updateItemPosition(p.new);
          })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'diary_items' },
          (p) => {
            const el = document.querySelector(`.item[data-item-id="${p.old.id}"]`);
            if (el) el.remove();
            renderedItems.delete(p.old.id);
          })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'diary_comments', filter: `session_date=eq.${today}` },
          (p) => { if (p.new.client_id !== clientId) renderComment(p.new); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'diary_main', filter: `session_date=eq.${today}` },
          (p) => {
            if (p.new && p.new.client_id !== clientId) {
              if (p.new.title !== titleInput.value) titleInput.value = p.new.title || '';
              if (p.new.weather) {
                document.querySelectorAll('.weather-grid .w').forEach(w => w.classList.remove('active'));
                const w = document.querySelector(`.weather-grid .w[data-w="${p.new.weather}"]`);
                if (w) w.classList.add('active');
              }
            }
          })
        .subscribe();

      // realtime fallback — 5초마다 새 stroke/item/comment 폴링 (realtime 끊겨도 동기화)
      setInterval(async () => {
        const lastStrokeTime = allStrokes.length > 0
          ? Math.max(...allStrokes.map(s => new Date(s.created_at).getTime()))
          : 0;
        const lastItemTime = Math.max(0, ...Array.from(renderedItems).map(() => 0)); // items 시간 추적 안 하니 0
        const sinceISO = new Date(Math.max(lastStrokeTime - 1000, 0)).toISOString();
        const { data: newStrokes } = await supabase
          .from('diary_strokes').select('*')
          .eq('session_date', today)
          .gt('created_at', sinceISO)
          .order('created_at');
        if (newStrokes) {
          newStrokes.forEach(s => {
            if (allStrokes.find(x => x.id === s.id)) return;
            allStrokes.push(s);
            drawStroke(s);
          });
        }
        // items 양방향 동기화 — DB에 없으면 화면에서도 제거 (다른 디바이스 삭제 반영)
        const { data: newItems } = await supabase
          .from('diary_items').select('*')
          .eq('session_date', today)
          .order('created_at');
        if (newItems) {
          const dbIds = new Set(newItems.map(it => String(it.id)));
          document.querySelectorAll('.canvas-area .item[data-item-id]').forEach(el => {
            const id = el.dataset.itemId;
            if (id && !dbIds.has(String(id))) {
              el.remove();
              renderedItems.delete(id);
            }
          });
          newItems.forEach(it => {
            if (!renderedItems.has(it.id)) {
              renderItem(it);
            } else if (it.client_id !== clientId) {
              // 다른 디바이스에서 변경된 위치/사이즈/회전 반영
              updateItemPosition(it);
            }
          });
        }
        // strokes도 양방향 — 다른 디바이스에서 지운 stroke가 화면에 남는 것 방지
        const { data: allCurrentStrokes } = await supabase
          .from('diary_strokes').select('id')
          .eq('session_date', today);
        if (allCurrentStrokes) {
          const dbStrokeIds = new Set(allCurrentStrokes.map(s => String(s.id)));
          const before = allStrokes.length;
          allStrokes = allStrokes.filter(s => dbStrokeIds.has(String(s.id)));
          if (allStrokes.length !== before) redraw();
        }
        // comments도
        const { data: newComments } = await supabase
          .from('diary_comments').select('*')
          .eq('session_date', today)
          .order('created_at');
        if (newComments) newComments.forEach(c => { if (!renderedComments.has(c.id)) renderComment(c); });
      }, 5000);

      const presence = supabase.channel('pres-' + today, { config: { presence: { key: clientId } } });
      presence.on('presence', { event: 'sync' }, () => {
        const c = Object.keys(presence.presenceState()).length;
        document.getElementById('usersBadge').textContent = `● ${c} ONLINE`;
      }).subscribe(async (s) => {
        if (s === 'SUBSCRIBED') await presence.track({ nickname: nickname || 'guest', role });
      });
    }

    // 모달 (닉네임 + 비번)
    const HOST_PASSWORD = 'ohyesjy';  // 변경하려면 이 한 줄만 수정

    document.getElementById('btnEnter').addEventListener('click', async () => {
      const fullName = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const v = document.getElementById('nicknameInput').value.trim();
      const userPw = document.getElementById('regUserPw').value;
      const genderEl = document.querySelector('input[name="gender"]:checked');

      // 성별 체크 — 여성 전용
      if (!genderEl) { toast('性別を選択 / 성별 선택'); return; }
      if (genderEl.value !== 'female') { toast('日本人女性専用スペースです 🙏'); return; }
      // 필수 필드
      if (!fullName) { toast('お名前を入力 / 성명 입력'); return; }
      if (!phone) { toast('電話番号 / 폰번호 입력'); return; }
      if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) { toast('正しいemail / 이메일 형식 확인'); return; }
      if (!v) { toast('ニックネーム / 닉네임 입력'); return; }
      if (!userPw || userPw.length < 4) { toast('パスワード4文字以上 / 비번 4자 이상'); return; }

      nickname = v;
      localStorage.setItem('mj_nickname', nickname);
      localStorage.setItem('mj_gender', 'female');
      localStorage.setItem('mj_email', email);
      localStorage.setItem('mj_full_name', fullName);
      localStorage.setItem('mj_phone', phone);

      // Supabase members 테이블에 INSERT 시도 (테이블 없으면 무시 — localStorage만으로도 작동)
      try {
        await supabase.from('members').upsert({
          email, full_name: fullName, phone, nickname, gender: 'female',
          password_hash: userPw  // 단순 저장 — 영석님이 후에 해시 적용 가능
        }, { onConflict: 'email' });
      } catch (e) {
        console.warn('members table insert skip:', e);
      }

      // 비번 체크
      const pw = document.getElementById('hostPassword').value;
      if (pw && pw === HOST_PASSWORD) {
        role = 'host';
      } else {
        role = 'visitor';
        if (pw && pw !== HOST_PASSWORD) toast('비밀번호 불일치 — visitor로 입장');
      }
      localStorage.setItem('mj_role', role);

      // 무조건 모달 닫기 (에러 나도 닫히도록)
      const em = document.getElementById('enterModal');
      em.classList.add('hidden');
      em.style.display = 'none';

      // 후속 작업은 각각 try/catch (하나가 실패해도 나머지 진행)
      try { applyRole(); } catch (e) { console.error('applyRole err', e); }
      try { resizeCanvas(); } catch (e) { console.error('resizeCanvas err', e); }
      try { loadAll(); } catch (e) { console.error('loadAll err', e); }
      try { subscribeRealtime(); } catch (e) { console.error('subscribeRealtime err', e); }
    });

    document.getElementById('btnCancel').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else window.location.href = 'index.html';
    });

    // 이미 가입한 회원이면 자동 입장 (모든 필수 정보 localStorage에 있으면)
    const savedEmail = localStorage.getItem('mj_email');
    const savedGender = localStorage.getItem('mj_gender');
    if (nickname) document.getElementById('nicknameInput').value = nickname;
    if (savedEmail) document.getElementById('regEmail').value = savedEmail;
    if (localStorage.getItem('mj_full_name')) document.getElementById('regName').value = localStorage.getItem('mj_full_name');
    if (localStorage.getItem('mj_phone')) document.getElementById('regPhone').value = localStorage.getItem('mj_phone');

    if (nickname && savedEmail && savedGender === 'female') {
      const em = document.getElementById('enterModal');
      em.classList.add('hidden');
      em.style.display = 'none';
      try { applyRole(); } catch (e) { console.error('applyRole', e); }
      try { resizeCanvas(); } catch (e) { console.error('resizeCanvas', e); }
      try { loadAll(); } catch (e) { console.error('loadAll', e); }
      try { subscribeRealtime(); } catch (e) { console.error('subscribeRealtime', e); }
    }
  </script>
</body>
</html>
