<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; -webkit-appearance: none; appearance: none; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  .cover {
    position: relative;
    height: 100%;
    max-height: 100vh;
    aspect-ratio: 2000 / 3900;
    background: #ffffff;
  }
  .cover-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    will-change: transform;
  }

  /* UFO — 우측 상단에 둥둥 떠있음 */
  .ufo {
    position: absolute;
    top: 5%;
    right: 4%;
    width: 26%;
    height: auto;
    z-index: 4;
    pointer-events: none;
    will-change: transform;
    animation: float 3.8s ease-in-out infinite;
    filter: drop-shadow(0 16px 18px rgba(0,0,0,0.08));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    25%      { transform: translateY(-10px) rotate(0.5deg); }
    50%      { transform: translateY(-16px) rotate(1.5deg); }
    75%      { transform: translateY(-8px) rotate(0.3deg); }
  }

  /* 캐릭터 클릭 영역 — main.html로 이동 */
  .char-hit {
    position: absolute;
    top: 30%;
    left: 52%;
    width: 28%;
    height: 38%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    outline: none;
    z-index: 5;
    border-radius: 14px;
    text-decoration: none;
  }
  .char-hit:hover, .char-hit:active, .char-hit:focus, .char-hit:focus-visible {
    background: transparent !important;
    outline: none !important;
    box-shadow: none !important;
  }
  .char-hit { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }

  /* 캐릭터 부르르 떨림 */
  .cover.is-shaking .cover-img {
    animation: char-shake 500ms cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes char-shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, 0); }
    30%, 50%, 70% { transform: translate(-3px, 0); }
    40%, 60% { transform: translate(3px, 0); }
  }

  /* 인스타 아이콘 클릭 영역 */
  .insta-hit {
    position: absolute;
    top: 65.5%;
    left: 64%;
    width: 9%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    border-radius: 22%;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    outline: none;
    z-index: 5;
    text-decoration: none;
  }
  .insta-hit:hover { background: transparent; }
  .insta-hit:active, .insta-hit:focus { outline: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
