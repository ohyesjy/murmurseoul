<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Special+Elite&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; -webkit-appearance: none; appearance: none; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #0a0a0a;
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 28px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* 굵은 핸드드로운 타이포 */
  .brand {
    font-family: "Hachi Maru Pop", "Special Elite", sans-serif;
    font-weight: 400;
    font-size: clamp(50px, 11vw, 100px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
    color: #0a0a0a;
  }
  .brand .dot {
    display: inline-block;
    margin-left: 0.06em;
  }

  .meta {
    margin: 28px 0 22px;
    font-family: "Hachi Maru Pop", sans-serif;
    font-weight: 400;
    font-size: clamp(20px, 4vw, 32px);
    line-height: 1.3;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: #0a0a0a;
  }
  .meta .line { display: block; }
  .meta .line + .line { margin-top: 4px; }

  .rule {
    width: 100%;
    height: 1px;
    background: #0a0a0a;
    opacity: 0.6;
    margin: 14px 0 28px;
  }

  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .small-logo, .small-date {
    font-family: "Special Elite", monospace;
    color: #0a0a0a;
    opacity: 0.7;
  }
  .small-logo { font-size: 13px; letter-spacing: 0.18em; }
  .small-date { font-size: 11px; letter-spacing: 0.12em; opacity: 0.55; }

  /* 구름/링 메인 — 둥둥 떠있는 애니메이션 */
  .cloud-btn {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    outline: none;
    margin-top: 12px;
    display: block;
    position: relative;
  }
  .cloud-wrap {
    display: inline-block;
    will-change: transform;
    animation: float 4.2s ease-in-out infinite;
  }
  .cloud-wrap img {
    display: block;
    width: clamp(210px, 58.5vw, 390px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    filter: drop-shadow(0 18px 28px rgba(180,180,200,0.18));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    25%      { transform: translateY(-8px) rotate(0.3deg); }
    50%      { transform: translateY(-14px) rotate(1deg); }
    75%      { transform: translateY(-6px) rotate(0.2deg); }
  }

  .cloud-btn.is-shaking .cloud-wrap {
    animation: cloud-shake 500ms cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes cloud-shake {
    10%, 90% { transform: translate(-1px, -8px) rotate(-0.5deg); }
    20%, 80% { transform: translate(2px, -10px) rotate(0.5deg); }
    30%, 50%, 70% { transform: translate(-3px, -12px) rotate(-1deg); }
    40%, 60% { transform: translate(3px, -10px) rotate(1deg); }
  }

  .footer-row {
    width: 100%;
    margin-top: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .footer-row a {
    color: #0a0a0a;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer-row a:hover { opacity: 0.6; }

  .fade {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
    z-index: 10;
  }
  .fade.is-on { opacity: 1; }

  @media (max-width: 540px) {
    .page { padding: 40px 22px 40px; }
    .meta { margin: 22px 0 14px; }
    .rule { margin: 10px 0 20px; }
    .footer-row { margin-top: 22px; }
  }

  .enter-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .enter-link {
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #0a0a0a;
    text-decoration: none;
    opacity: 0.7;
    white-space: nowrap;
    transition: opacity 200ms ease;
  }
  .enter-link:hover { opacity: 1; }
  .enter-link .sub {
    font-size: 9px;
    opacity: 0.65;
    letter-spacing: 0.1em;
    margin-left: 2px;
  }


  .cloud-btn { position: relative; }
  .typing-box {
    width: 100%;
    max-width: 540px;
    margin: 8px auto 0;
    min-height: 180px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0 12px;
  }
  .typing-line {
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    font-size: clamp(14px, 2.2vw, 18px);
    line-height: 1.85;
    letter-spacing: 0.04em;
    color: #1a1a1a;
    white-space: pre-line;
    text-align: left;
    min-height: 1em;
  }
  .typing-line .cursor {
    display: inline-block;
    width: 0.5em;
    background: #1a1a1a;
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
    vertical-align: -2px;
  }
  @keyframes blink { 50% { opacity: 0; } }


  /* 회원전용 모달 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal-card {
    background: #ffffff;
    border: 1px solid #c8243a;
    padding: 36px 28px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    border-radius: 4px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.15);
  }
  .modal-icon { font-size: 28px; margin-bottom: 12px; opacity: 0.85; }
  .modal-title {
    font-family: "Special Elite", monospace;
    font-size: 15px;
    letter-spacing: 0.16em;
    margin-bottom: 14px;
    color: #0a0a0a;
  }
  .modal-text {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
    margin: 0 0 24px;
  }
  .modal-text .modal-ja { display: block; margin-top: 6px; font-size: 13px; color: #555; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-btn {
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    padding: 10px 22px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #0a0a0a;
    transition: opacity 200ms ease;
  }
  .modal-btn:hover { opacity: 0.78; }
  .modal-btn.primary { background: #0a0a0a; color: #fff; }
  .modal-btn.secondary { background: #fff; color: #0a0a0a; }

</style>
</head>

  <div class="fade" id="fade"></div>

  <!-- 회원전용 모달 -->
  <div class="modal-overlay" id="diaryModal">
    <div class="modal-card">
      <div class="modal-icon">⚲</div>
      <div class="modal-title">MEMBERS ONLY</div>
      <p class="modal-text">
        会員登録された方のみご入場いただけます。
        <span class="modal-ja">회원가입해야 입장가능해요!</span>
      </p>
      <div class="modal-actions">
        <button type="button" class="modal-btn primary" id="signupBtn">등록하기</button>
        <button type="button" class="modal-btn secondary" id="cancelBtn">취소</button>
      </div>
    </div>
  </div>

  <script>
    // 타이핑 효과
    const TYPE_TEXT = `よくはわからないけど。。
おかげさまで私も
旅してる勘違いをしたり。。。

そうだ。
ここはこういうところだった。`;
    const typeEl = document.getElementById('typeText');
    let i = 0;
    function typeNext() {
      if (i < TYPE_TEXT.length) {
        typeEl.innerHTML = TYPE_TEXT.slice(0, i+1).replace(/\n/g, '<br/>') + '<span class="cursor">&nbsp;</span>';
        i++;
        const ch = TYPE_TEXT[i-1];
        const delay = ch === '\n' ? 280 : (ch === '。' || ch === '、' ? 180 : 75);
        setTimeout(typeNext, delay);
      } else {
        typeEl.innerHTML = TYPE_TEXT.replace(/\n/g, '<br/>') + '<span class="cursor">&nbsp;</span>';
      }
    }
    setTimeout(typeNext, 600);

    const cloud = document.getElementById('cloud');
    const fade = document.getElementById('fade');

    // 클라우드 클릭 → 메인(분당) 페이지로
    cloud.addEventListener('click', function (e) {
      if (cloud.classList.contains('is-shaking')) return;
      e.preventDefault();
      cloud.classList.add('is-shaking');
      setTimeout(() => fade.classList.add('is-on'), 350);
      setTimeout(() => { window.location.href = 'stage.html'; }, 700);
    });

    // 스택 버튼들 — 부드러운 페이드 후 이동
    document.querySelectorAll('.enter-link').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();

        // diary는 멤버 모달을 띄움
        if (this.classList.contains('diary-link')) {
          document.getElementById('diaryModal').classList.add('is-open');
          return;
        }

        const href = this.getAttribute('href');
        fade.classList.add('is-on');
        setTimeout(() => { window.location.href = href; }, 400);
      });
    });

    // 모달 버튼들
    document.getElementById('signupBtn').addEventListener('click', function () {
      // 등록하기 → diary 페이지로 이동 (현재 placeholder, 추후 회원가입 페이지로 변경)
      document.getElementById('diaryModal').classList.remove('is-open');
      fade.classList.add('is-on');
      setTimeout(() => { window.location.href = 'diary.html'; }, 400);
    });
    document.getElementById('cancelBtn').addEventListener('click', function () {
      document.getElementById('diaryModal').classList.remove('is-open');
    });
    document.getElementById('diaryModal').addEventListener('click', function (e) {
      if (e.target === this) this.classList.remove('is-open');
    });
  </script>
