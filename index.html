<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Special+Elite&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; -webkit-appearance: none; appearance: none; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #0a0a0a;
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 28px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* 굵은 핸드드로운 타이포 */
  .brand {
    font-family: "Hachi Maru Pop", "Special Elite", sans-serif;
    font-weight: 400;
    font-size: clamp(50px, 11vw, 100px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
    color: #0a0a0a;
  }
  .brand .dot {
    display: inline-block;
    margin-left: 0.06em;
  }

  .meta {
    margin: 28px 0 22px;
    font-family: "Hachi Maru Pop", sans-serif;
    font-weight: 400;
    font-size: clamp(20px, 4vw, 32px);
    line-height: 1.3;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: #0a0a0a;
  }
  .meta .line { display: block; }
  .meta .line + .line { margin-top: 4px; }

  .rule {
    width: 100%;
    height: 1px;
    background: #0a0a0a;
    opacity: 0.6;
    margin: 14px 0 28px;
  }

  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .small-logo, .small-date {
    font-family: "Special Elite", monospace;
    color: #0a0a0a;
    opacity: 0.7;
  }
  .small-logo { font-size: 13px; letter-spacing: 0.18em; }
  .small-date { font-size: 11px; letter-spacing: 0.12em; opacity: 0.55; }

  /* 구름/링 메인 — 둥둥 떠있는 애니메이션 */
  .cloud-btn {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    outline: none;
    margin-top: 12px;
    display: block;
    position: relative;
  }
  .cloud-wrap {
    display: inline-block;
    will-change: transform;
    animation: float 4.2s ease-in-out infinite;
  }
  .cloud-wrap img {
    display: block;
    width: clamp(280px, 78vw, 520px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    filter: drop-shadow(0 18px 28px rgba(180,180,200,0.18));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    25%      { transform: translateY(-8px) rotate(0.3deg); }
    50%      { transform: translateY(-14px) rotate(1deg); }
    75%      { transform: translateY(-6px) rotate(0.2deg); }
  }

  .cloud-btn.is-shaking .cloud-wrap {
    animation: cloud-shake 500ms cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes cloud-shake {
    10%, 90% { transform: translate(-1px, -8px) rotate(-0.5deg); }
    20%, 80% { transform: translate(2px, -10px) rotate(0.5deg); }
    30%, 50%, 70% { transform: translate(-3px, -12px) rotate(-1deg); }
    40%, 60% { transform: translate(3px, -10px) rotate(1deg); }
  }

  .footer-row {
    width: 100%;
    margin-top: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .footer-row a {
    color: #0a0a0a;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer-row a:hover { opacity: 0.6; }

  .fade {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
    z-index: 10;
  }
  .fade.is-on { opacity: 1; }

  @media (max-width: 540px) {
    .page { padding: 40px 22px 40px; }
    .meta { margin: 22px 0 14px; }
    .rule { margin: 10px 0 20px; }
    .footer-row { margin-top: 22px; }
  }
</style>
</head>
