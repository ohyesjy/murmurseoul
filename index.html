<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  * {
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  .cover {
    position: relative;
    height: 100%;
    max-height: 100vh;
    aspect-ratio: 2000 / 3900;
    background: #ffffff;
  }
  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* 인스타 아이콘 클릭 영역 — mur mur josun 텍스트 아래 */
  .insta-hit {
    position: absolute;
    top: 65.5%;
    left: 64%;
    width: 9%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    border-radius: 22%;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    outline: none;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 200ms ease;
  }
  .insta-hit:hover {
    background: transparent;
  }
  .insta-hit:active,
  .insta-hit:focus {
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 네온 인디 핑크 파장 (진동) */
  .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: none;
    opacity: 0;
  }
  .insta-hit.is-active {
    animation: shake 400ms ease-in-out;
  }
  .insta-hit.is-active .ripple {
    animation: neon-wave 900ms ease-out forwards;
  }
  .insta-hit.is-active .ripple.r2 { animation-delay: 150ms; }
  .insta-hit.is-active .ripple.r3 { animation-delay: 300ms; }

  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%) translateX(0); }
    20% { transform: translate(-50%, -50%) translateX(-3px); }
    40% { transform: translate(-50%, -50%) translateX(3px); }
    60% { transform: translate(-50%, -50%) translateX(-2px); }
    80% { transform: translate(-50%, -50%) translateX(2px); }
  }

  @keyframes neon-wave {
    0% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      box-shadow:
        0 0 0 0 rgba(255, 20, 147, 0.9),
        0 0 28px 8px rgba(255, 20, 147, 0.65),
        0 0 70px 22px rgba(255, 105, 180, 0.55);
      background: radial-gradient(circle, rgba(255,20,147,0.55) 0%, rgba(255,20,147,0) 70%);
    }
    60% { opacity: 0.55; }
    100% {
      transform: translate(-50%, -50%) scale(30);
      opacity: 0;
      background: radial-gradient(circle, rgba(255,20,147,0) 0%, rgba(255,20,147,0) 70%);
    }
  }

  /* 캐릭터 클릭 영역 — main.html로 이동 */
  .char-hit {
    position: absolute;
    top: 30%;
    left: 52%;
    width: 28%;
    height: 38%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    outline: none;
    z-index: 4;
    border-radius: 14px;
    transition: background 200ms ease;
    text-decoration: none;
  }
  .char-hit:hover,
  .char-hit:active,
  .char-hit:focus,
  .char-hit:focus-visible {
    background: transparent !important;
    outline: none !important;
    -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
    box-shadow: none !important;
    -webkit-appearance: none;
    appearance: none;
  }
  .char-hit {
    -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
    -webkit-appearance: none;
    appearance: none;
    user-select: none;
    -webkit-user-select: none;
  }



  /* 캐릭터 부르르 떨림 — .cover 전체에 적용 */
  .cover.is-shaking {
    animation: char-shake 500ms cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes char-shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, 0); }
    30%, 50%, 70% { transform: translate(-3px, 0); }
    40%, 60% { transform: translate(3px, 0); }
  }

</style>
