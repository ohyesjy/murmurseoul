<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Special+Elite&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; -webkit-appearance: none; appearance: none; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #fff; color: #0a0a0a; font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif; user-select: none; -webkit-user-select: none; overflow-x: hidden; }
  .page { min-height: 100vh; width: 100%; max-width: 760px; margin: 0 auto; padding: 56px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .brand { font-family: "Hachi Maru Pop", "Special Elite", sans-serif; font-weight: 400; font-size: clamp(50px, 11vw, 100px); line-height: 0.95; letter-spacing: -0.02em; margin: 0; }
  .meta { margin: 28px 0 22px; font-family: "Hachi Maru Pop", sans-serif; font-size: clamp(20px, 4vw, 32px); line-height: 1.3; text-transform: uppercase; }
  .meta .line { display: block; }
  .meta .line + .line { margin-top: 4px; }
  .rule { width: 100%; height: 1px; background: #0a0a0a; opacity: 0.6; margin: 14px 0 28px; }
  .row { width: 100%; display: flex; justify-content: space-between; margin-bottom: 12px; font-family: "Special Elite", monospace; opacity: 0.7; }
  .row .small-logo { font-size: 13px; letter-spacing: 0.18em; }
  .row .small-date { font-size: 11px; letter-spacing: 0.12em; opacity: 0.55; }

  .cloud-btn { position: relative; background: transparent; border: 0; padding: 0; cursor: pointer; outline: none; margin-top: 12px; display: block; }
  .cloud-wrap { display: inline-block; will-change: transform; animation: float 4.2s ease-in-out infinite; }
  .cloud-wrap img { display: block; width: clamp(210px, 58.5vw, 390px); height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 18px 28px rgba(180,180,200,0.18)); }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    25% { transform: translateY(-8px) rotate(0.3deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
    75% { transform: translateY(-6px) rotate(0.2deg); }
  }
  .cloud-btn.is-shaking .cloud-wrap { animation: shake 500ms cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%,90% { transform: translate(-1px,-8px) rotate(-0.5deg); }
    20%,80% { transform: translate(2px,-10px) rotate(0.5deg); }
    30%,50%,70% { transform: translate(-3px,-12px) rotate(-1deg); }
    40%,60% { transform: translate(3px,-10px) rotate(1deg); }
  }

  /* 타이핑 텍스트 — UFO 우측 옆, 애니메이션 영향 X */
  .typing-overlay { position: absolute; top: 6%; right: -6%; text-align: left; pointer-events: none; z-index: 3; max-width: 50%; }
  .typing-line { font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif; font-size: clamp(12px, 1.88vw, 15.5px); line-height: 1.85; letter-spacing: 0.04em; color: #1a1a1a; white-space: pre-line; text-align: left; min-height: 1em; }
  .typing-line .cursor { display: inline-block; width: 0.5em; background: #1a1a1a; animation: blink 1s steps(2) infinite; margin-left: 1px; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width:540px) {
    .typing-overlay { top: 4%; right: -10%; max-width: 60%; }
    .typing-line { font-size: 10.5px; line-height: 1.7; }
  }

  .footer-row { width: 100%; margin-top: 36px; display: flex; justify-content: space-between; align-items: flex-start; font-family: "Special Elite", monospace; }
  .footer-row > a { color: #0a0a0a; text-decoration: none; font-size: 12px; letter-spacing: 0.15em; opacity: 0.7; }
  .footer-row > a:hover { opacity: 1; }
  .enter-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .enter-link { font-family: "Special Elite", monospace; font-size: 12px; letter-spacing: 0.15em; color: #0a0a0a; text-decoration: none; opacity: 0.7; white-space: nowrap; cursor: pointer; }
  .enter-link:hover { opacity: 1; }

  .fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 50; }
  .fade.is-on { opacity: 1; }

  /* 모달 — 강력하게 fixed 적용 */
  .modal-overlay {
    position: fixed !important;
    top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important;
    background: rgba(0,0,0,0.45) !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
    z-index: 9999 !important;
    padding: 24px !important;
    margin: 0 !important;
  }
  .modal-overlay.is-open { display: flex !important; }
  .modal-card { background: #fff; border: 1px solid #c8243a; padding: 36px 28px 26px; max-width: 380px; width: 100%; text-align: center; border-radius: 4px; box-shadow: 0 14px 40px rgba(0,0,0,0.15); }
  .modal-icon { font-size: 28px; margin-bottom: 12px; opacity: 0.85; }
  .modal-title { font-family: "Special Elite", monospace; font-size: 15px; letter-spacing: 0.16em; margin-bottom: 14px; }
  .modal-text { font-size: 14px; line-height: 1.7; margin: 0 0 24px; }
  .modal-text .modal-ja { display: block; margin-top: 6px; font-size: 13px; color: #555; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-btn { font-family: "Special Elite", monospace; font-size: 12px; letter-spacing: 0.15em; padding: 10px 22px; border-radius: 4px; cursor: pointer; border: 1px solid #0a0a0a; }
  .modal-btn.primary { background: #0a0a0a; color: #fff; }
  .modal-btn.secondary { background: #fff; color: #0a0a0a; }

  /* 타이핑 텍스트 — 별/UFO 아래에 가운데 정렬, 흔들리지 않음 */
  .typing-below {
    width: 100%;
    max-width: 540px;
    margin: 18px auto 8px;
    padding: 0 12px;
    min-height: 160px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .typing-line {
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    font-size: clamp(12px, 1.88vw, 15.5px);
    line-height: 1.85;
    letter-spacing: 0.04em;
    color: #1a1a1a;
    white-space: pre-line;
    text-align: center;
    min-height: 1em;
  }
  .typing-line .cursor {
    display: inline-block;
    width: 0.5em;
    background: #1a1a1a;
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
    vertical-align: -2px;
  }
  @keyframes blink { 50% { opacity: 0; } }


  /* 타이핑 — 별 아래, 페이지 가운데 / 텍스트는 좌측정렬 */
  .typing-below {
    width: 100%;
    max-width: 480px;
    margin: 18px auto 8px;
    padding: 0 12px;
    min-height: 160px;
    display: flex;
    justify-content: center;
  }
  .typing-line {
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    font-size: clamp(12px, 1.88vw, 15.5px);
    line-height: 1.85;
    letter-spacing: 0.04em;
    color: #1a1a1a;
    white-space: pre-line;
    text-align: left;
    min-height: 1em;
  }
  .typing-line .cursor {
    display: inline-block;
    width: 0.5em;
    background: #1a1a1a;
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
    vertical-align: -2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

</style>

  <div class="modal-overlay" id="diaryModal">
    <div class="modal-card">
      <div class="modal-icon">⚲</div>
      <div class="modal-title">MEMBERS ONLY</div>
      <p class="modal-text">
        会員登録された方のみご入場いただけます。
        <span class="modal-ja">회원가입해야 입장가능해요!</span>
      </p>
      <div class="modal-actions">
        <button type="button" class="modal-btn primary" id="signupBtn">등록하기</button>
        <button type="button" class="modal-btn secondary" id="cancelBtn">취소</button>
      </div>
    </div>
  </div>

  <script>
    // 타이핑 효과
    const TYPE_TEXT = `よくはわからないけど。。
おかげさまで私も
旅してる勘違いをしたり。。。

そうだ。
ここはこういうところだった。`;
    const typeEl = document.getElementById('typeText');
    let i = 0;
    function typeNext() {
      if (i < TYPE_TEXT.length) {
        typeEl.innerHTML = TYPE_TEXT.slice(0, i+1).replace(/\n/g, '<br/>') + '<span class="cursor">&nbsp;</span>';
        i++;
        const ch = TYPE_TEXT[i-1];
        setTimeout(typeNext, ch === '\n' ? 280 : (ch === '。' || ch === '、' ? 180 : 75));
      }
    }
    setTimeout(typeNext, 600);

    const cloud = document.getElementById('cloud');
    const fade = document.getElementById('fade');
    const modal = document.getElementById('diaryModal');

    cloud.addEventListener('click', function (e) {
      if (cloud.classList.contains('is-shaking')) return;
      e.preventDefault();
      cloud.classList.add('is-shaking');
      setTimeout(() => fade.classList.add('is-on'), 350);
      setTimeout(() => { window.location.href = 'stage.html'; }, 700);
    });

    document.querySelectorAll('.enter-link').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        if (this.classList.contains('diary-link')) {
          modal.classList.add('is-open');
          return;
        }
        const href = this.getAttribute('href');
        fade.classList.add('is-on');
        setTimeout(() => { window.location.href = href; }, 400);
      });
    });

    document.getElementById('signupBtn').addEventListener('click', function () {
      modal.classList.remove('is-open');
      fade.classList.add('is-on');
      setTimeout(() => { window.location.href = 'diary.html'; }, 400);
    });
    document.getElementById('cancelBtn').addEventListener('click', function () {
      modal.classList.remove('is-open');
    });
    modal.addEventListener('click', function (e) {
      if (e.target === modal) modal.classList.remove('is-open');
    });
  </script>
