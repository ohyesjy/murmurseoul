<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>murmur josun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Special+Elite&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; -webkit-appearance: none; appearance: none; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #0a0a0a;
    font-family: "Zen Kaku Gothic New", "Apple SD Gothic Neo", sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  .page {
    min-height: 100vh;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 32px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* TDC 스타일 굵직한 핸드드로운 타이포 */
  .brand {
    font-family: "Hachi Maru Pop", "Special Elite", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 12vw, 110px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
    color: #0a0a0a;
  }
  .brand .dot {
    display: inline-block;
    transform: translateY(-0.1em);
    margin-left: 0.06em;
  }

  /* 본문 메타 — 굵은 sans 한 줄씩 */
  .meta {
    margin: 32px 0 24px;
    font-family: "Hachi Maru Pop", sans-serif;
    font-weight: 400;
    font-size: clamp(22px, 4.4vw, 38px);
    line-height: 1.25;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: #0a0a0a;
  }
  .meta .line { display: block; }
  .meta .line + .line { margin-top: 6px; }

  /* 작은 라인 */
  .rule {
    width: 100%;
    height: 1px;
    background: #0a0a0a;
    margin: 18px 0 36px;
  }

  /* 좌측 작은 로고 자리 (ggg 같은 위치) */
  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .small-logo {
    font-family: "Special Elite", monospace;
    font-size: 14px;
    letter-spacing: 0.18em;
    color: #0a0a0a;
    opacity: 0.75;
  }
  .small-date {
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #0a0a0a;
    opacity: 0.6;
  }

  /* 메인 캐릭터 (TDC 포스터의 3D 헤드 위치와 유사) */
  .char-btn {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    outline: none;
    margin-top: 12px;
    display: block;
    position: relative;
  }
  .char-btn img {
    display: block;
    width: clamp(220px, 60vw, 420px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    transition: transform 250ms ease;
    filter: contrast(1.05);
  }
  .char-btn.is-shaking img {
    animation: char-shake 500ms cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes char-shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, 0); }
    30%, 50%, 70% { transform: translate(-3px, 0); }
    40%, 60% { transform: translate(3px, 0); }
  }

  /* 좌측 하단 인스타 + 우측 하단 ENTER 화살표 */
  .footer-row {
    width: 100%;
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Special Elite", monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .footer-row a {
    color: #0a0a0a;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer-row a:hover { opacity: 0.6; }

  .fade {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
    z-index: 10;
  }
  .fade.is-on { opacity: 1; }

  @media (max-width: 540px) {
    .page { padding: 40px 22px 48px; }
    .meta { margin: 24px 0 16px; }
    .rule { margin: 12px 0 24px; }
  }
</style>
</head>

    function go() {
      if (char.classList.contains('is-shaking')) return;
      char.classList.add('is-shaking');
      setTimeout(() => fade.classList.add('is-on'), 350);
      setTimeout(() => { window.location.href = 'main.html'; }, 700);
    }
    char.addEventListener('click', function (e) { e.preventDefault(); go(); });
    enterLink.addEventListener('click', function (e) { e.preventDefault(); go(); });
  </script>
</body>
</html>
